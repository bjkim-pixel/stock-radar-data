name: "[점검] 자동매매 전략 가상↔실전 차이·드라이런 진행 | 수동(읽기 전용)"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary
      - run: python 176_auto_audit.py | tee auto_audit.md
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: auto-audit-report
          file: auto_audit.md
