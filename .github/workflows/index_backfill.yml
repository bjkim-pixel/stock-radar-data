name: Index Backfill (KOSPI/KOSDAQ)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일 (YYYYMMDD, 비우면 20250901)'
        required: false
        default: '20250901'

jobs:
  backfill_index:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary requests

      - name: Run index backfill
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          START="${{ github.event.inputs.start_date }}"
          if [ -z "$START" ]; then START="20250901"; fi
          python 20_collect_market_extra.py --backfill-index "$START"

      - name: Notify on failure
        if: failure()
        run: echo "::error::지수 백필 실패! GitHub Actions 로그를 확인하세요."
