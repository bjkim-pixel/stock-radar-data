name: "[분기] 해외 주식 소개·주주 구성 | 네이버 | 수동·매월 1일"
on:
  workflow_dispatch:
    inputs:
      step:
        description: "종목코드(쉼표, 비우면 전체)"
        default: ""
  schedule:
    - cron: "0 18 1 * *"
permissions:
  contents: write
concurrency:
  group: ovs-profile
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - run: python 209_ovs_profile.py "${{ github.event.inputs.step }}"
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: ovs-profile-report
          file: ovs_profile.md
