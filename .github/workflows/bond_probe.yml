name: Bond Probe (KIS 채권 API 점검, 읽기 전용)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary requests
      - name: Probe
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 98_bond_probe.py --report bond_probe_report.md
      - name: Publish report (branch bond-probe-report)
        if: always()
        run: |
          [ -f bond_probe_report.md ] || echo "리포트 없음 — 실패. Actions 로그 확인" > bond_probe_report.md
          cp bond_probe_report.md /tmp/bond_probe_report.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan bond-probe-report
          git rm -rq --cached . || true
          cp /tmp/bond_probe_report.md bond_probe_report.md
          git add -f bond_probe_report.md
          git commit -qm "bond probe ${{ github.run_id }}"
          git push -f origin bond-probe-report
