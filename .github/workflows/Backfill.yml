name: KIS Backfill

on:
  workflow_dispatch:
    inputs:
      target:
        description: '백필 대상 — stocks: 종목별 시세/수급(04_backfill.py) · index: KOSPI/KOSDAQ 종합지수(20_collect_market_extra.py, quarantine_outliers 이상치 재검증 포함)'
        required: false
        default: 'stocks'
        type: choice
        options:
          - stocks
          - index
      start_date:
        description: '시작일 (YYYYMMDD, 비우면 2025-09-01)'
        required: false
        default: '20250901'
      end_date:
        description: '종료일 (YYYYMMDD, 비우면 어제) — target=index일 때는 무시됩니다(항상 오늘까지)'
        required: false
        default: ''
      compare_only:
        description: '재수집 없이 KRX vs KIS 비교만 실행 (target=stocks 전용)'
        required: false
        default: false
        type: boolean
      debug:
        description: '삼성전자 응답 원문만 출력 (약 10초, 필드명 확인용) (target=stocks 전용)'
        required: false
        default: false
        type: boolean

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 2026-08-26: 프로그램매매(program-trade-by-stock-daily) 백필 추가로
    # 종목당 API 호출이 2배(투자자별+프로그램매매)가 돼 40분으로는 부족할 수
    # 있어 넉넉히 조정.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary requests

      - name: Run backfill
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TARGET="${{ github.event.inputs.target }}"
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          COMPARE="${{ github.event.inputs.compare_only }}"
          DEBUG="${{ github.event.inputs.debug }}"

          if [ "$TARGET" = "index" ]; then
            # KOSPI/KOSDAQ 종합지수를 start_date~오늘 전체 재조회 후 quarantine_outliers()로
            # 이상치(단위 깨짐 등으로 튄 값) 재검증 — 과거에 잘못 저장된 구간이 있으면
            # 이 실행으로 NULL 초기화되고, 이어서 이번에 새로 받은 정상 값으로 다시 채워집니다.
            python 20_collect_market_extra.py --backfill-index "$START"
          elif [ "$DEBUG" = "true" ]; then
            python 04_backfill.py --debug
          elif [ "$COMPARE" = "true" ]; then
            python 04_backfill.py --compare-only
          elif [ -z "$END" ]; then
            python 04_backfill.py "$START"
          else
            python 04_backfill.py "$START" "$END"
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="백필 실패! GitHub Actions 로그를 확인하세요."
          echo "::error::$MSG"
          # 2026-09-12: ::error:: 주석은 GitHub Actions 로그를 직접 열어보지 않으면
          # 아무도 못 보므로, relay-server가 이미 쓰는 것과 같은 텔레그램 봇으로 실제
          # 알림을 보냅니다. 리포지토리 시크릿에 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID를
          # 등록해야 동작하고(둘 다 relay-server Render 환경변수와 같은 값 사용 가능),
          # 등록 전까지는 예전처럼 ::error:: 로그만 남습니다.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true
          fi