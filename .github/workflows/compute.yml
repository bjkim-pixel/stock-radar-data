name: Compute Metrics & Signals

on:
  schedule:
    # daily_collect.yml(16:05/20:05 KST) 수집이 끝난 뒤 지표·신호를 갱신합니다.
    # 스케줄 실행에서는 05_compute.py에 오늘 날짜 하루만 넘겨 매번 전체 기간을
    # 재계산하지 않게 합니다(하루치만 계산하는 용도로 스크립트가 이미 지원).
    #
    # 1차 16:30 KST — 지표·신호 계산 + 실제 가상매수/매도 실행(포지션 확정)
    # 2차 18:30 KST — 지표·신호만 재계산해 3단계 후보를 다시 보여줌(--no-portfolio,
    #                 가상매수는 실행하지 않음). 1차 대비 후보 종목 변화 비교용.
    - cron: "30 7 * * 1-5"   # 16:30 KST = 07:30 UTC (매수·매도 실행)
    - cron: "30 9 * * 1-5"   # 18:30 KST = 09:30 UTC (후보만 재조회, 매수 없음)
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일 (YYYYMMDD, 비우면 DB 전체 기간)'
        required: false
        default: ''
      end_date:
        description: '종료일 (YYYYMMDD, 비우면 start_date와 동일)'
        required: false
        default: ''

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Compute
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 스케줄 실행 = daily_collect 직후 그날 하루치만 재계산
            # 18:30 KST(09:30 UTC) 스케줄은 후보 재조회만 하고 가상매수는 실행하지 않음
            if [ "${{ github.event.schedule }}" = "30 9 * * 1-5" ]; then
              echo "▶ 18:30 KST 2차 실행 — 후보만 재계산 (가상매수 없음)"
              python 05_compute.py "$(date +%Y%m%d)" --no-portfolio
            else
              python 05_compute.py "$(date +%Y%m%d)"
            fi
          else
            START="${{ github.event.inputs.start_date }}"
            END="${{ github.event.inputs.end_date }}"
            if [ -z "$START" ]; then
              python 05_compute.py
            elif [ -z "$END" ]; then
              python 05_compute.py "$START"
            else
              python 05_compute.py "$START" "$END"
            fi
          fi

      - name: Notify on failure
        if: failure()
        run: echo "::error::지표·신호 계산 실패! GitHub Actions 로그를 확인하세요."
