name: Compute Metrics & Signals

on:
  # 2026-10-25: 16:30 KST 단독 스케줄을 없앴습니다. 이제 "Daily Collect + Compute (수집·계산 통합)"이 수집을 끝내면 이 워크플로를
  # 같은 실행 안에서 이어서 호출합니다(workflow_call, daily=true) — 수집→계산을 한 번에 실행.
  # 아래 workflow_run(NXT 18시 스냅샷 직후 종가베팅2 매수 확정)과 수동 실행(기간 지정·포트폴리오만)은 그대로입니다.
  workflow_call:
    inputs:
      daily:
        description: '일일 파이프라인에서 호출됨 — 오늘(또는 date) 하루치만 계산'
        type: boolean
        required: false
        default: false
      date:
        description: '계산할 날짜 (YYYYMMDD, 비우면 오늘)'
        type: string
        required: false
        default: ''
  workflow_run:
    # nxt_collect.yml("NXT After-market Collection")의 6개 스케줄 실행
    # (18:00~19:50 KST 장중 5회 + 20:10 KST 공식마감 1회)이 끝날 때마다 발화.
    # Compute 스텝에서 시각(KST)으로 장중/마감을 구분해 --no-portfolio 여부를
    # 결정합니다(아래 참고) — nxt_collect.yml 쪽 cron을 나중에 바꿔도 이 워크플로
    # 수정 없이 그대로 따라갑니다.
    workflows: ["NXT After-market Collection"]
    types: [completed]
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일 (YYYYMMDD, 비우면 DB 전체 기간)'
        required: false
        default: ''
      end_date:
        description: '종료일 (YYYYMMDD, 비우면 start_date와 동일)'
        required: false
        default: ''
      portfolio_only:
        description: '포트폴리오(가상매매)만 다시 계산 — 지표·신호 계산 생략(가볍다). 넓은 기간 신호 기록용'
        type: boolean
        required: false
        default: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          # 2026-09-12: workflow_run 트리거 전용 가드 — nxt_collect.yml 실행이
          # 실패/취소됐으면 그 값으로 매수를 확정하면 안 되므로 건너뜁니다.
          # 또한 nxt_collect.yml의 debug_code 등 수동/디버그 실행에는 반응하지
          # 않고, 정상 스케줄 실행 완료에만 반응합니다.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "is_market_day=false" >> "$GITHUB_OUTPUT"
              echo "⏸️ nxt_collect 실행이 성공하지 못해(conclusion=${{ github.event.workflow_run.conclusion }}) compute를 건너뜁니다"
              exit 0
            fi
            if [ "${{ github.event.workflow_run.event }}" != "schedule" ]; then
              echo "is_market_day=false" >> "$GITHUB_OUTPUT"
              echo "⏸️ 수동/디버그로 트리거된 nxt_collect라 compute는 건너뜁니다(event=${{ github.event.workflow_run.event }})"
              exit 0
            fi
          fi
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 이후 단계를 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: steps.market_day.outputs.is_market_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.market_day.outputs.is_market_day == 'true'
        run: pip install psycopg2-binary

      - name: Compute
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ "${{ inputs.daily }}" = "true" ]; then
            # 일일 파이프라인(수집 직후): 오늘 또는 지정한 날짜 하루치 지표·신호 계산 + 가상매수/매도 실행
            D="${{ inputs.date }}"; [ -z "$D" ] && D="$(date +%Y%m%d)"
            python 05_compute.py "$D"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # (예전) 16:30 KST 하나뿐 — 지표·신호 계산 + 실제 가상매수/매도 실행.
            python 05_compute.py "$(date +%Y%m%d)"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # nxt_collect.yml 스케줄 실행이 성공적으로 끝난 직후 실행됩니다.
            # 2026-09-22: nxt_collect.yml을 하루 6회 → 18:12 KST 1회로 줄이면서,
            # workflow_run이 이제 하루에 한 번만 발화하므로 "이게 첫 실행인지
            # 나중 재확인 실행인지"를 시각(HOUR_INT 1809~1830)으로 구분하던
            # 로직이 더 이상 필요 없어짐 — 나중 실행 자체가 없기 때문. 스케줄
            # 지연으로 실제 도착 시각이 18:30을 넘겨도(그동안 있었던 문제)
            # 항상 종가베팅2 가상매수를 확정하도록 단순화.
            echo "▶ NXT 18시 스냅샷 수집 완료 감지 — 종가베팅2 매수 확정"
            python 05_compute.py "$(date +%Y%m%d)"
          else
            START="${{ github.event.inputs.start_date }}"
            END="${{ github.event.inputs.end_date }}"
            FLAG=""
            if [ "${{ github.event.inputs.portfolio_only }}" = "true" ]; then FLAG="--portfolio-only"; fi
            if [ -z "$START" ]; then
              python 05_compute.py $FLAG
            elif [ -z "$END" ]; then
              python 05_compute.py "$START" $FLAG
            else
              python 05_compute.py "$START" "$END" $FLAG
            fi
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="지표·신호 계산 실패! GitHub Actions 로그를 확인하세요."
          echo "::error::$MSG"
          # 2026-09-12: ::error:: 주석은 GitHub Actions 로그를 직접 열어보지 않으면
          # 아무도 못 보므로, relay-server가 이미 쓰는 것과 같은 텔레그램 봇으로 실제
          # 알림을 보냅니다. 리포지토리 시크릿에 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID를
          # 등록해야 동작하고(둘 다 relay-server Render 환경변수와 같은 값 사용 가능),
          # 등록 전까지는 예전처럼 ::error:: 로그만 남습니다.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true
          fi
