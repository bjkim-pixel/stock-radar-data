name: "[상시2] 지표·신호 계산 (1번 직후 자동) | 수집 직후 | MA·RS·신호·가상매매"

on:
  # 2026-10-25: 16:30 KST 단독 스케줄을 없앴습니다. 이제 "Daily Collect + Compute (수집·계산 통합)"이 수집을 끝내면 이 워크플로를
  # 같은 실행 안에서 이어서 호출합니다(workflow_call, daily=true) — 수집→계산을 한 번에 실행.
  # 수동 실행(기간 지정·포트폴리오만)도 가능합니다. (2026-11-06: NXT 수집 직후 자동 재계산(workflow_run)은 NXT 수집 폐지와 함께 없앴습니다.)
  workflow_call:
    inputs:
      daily:
        description: '일일 파이프라인에서 호출됨 — 오늘(또는 date) 하루치만 계산'
        type: boolean
        required: false
        default: false
      date:
        description: '계산할 날짜 (YYYYMMDD, 비우면 오늘)'
        type: string
        required: false
        default: ''
      no_portfolio:
        description: '지표·신호만 계산하고 가상매매(포트폴리오)는 건너뜀 — 장중 잠정치용'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일 (YYYYMMDD, 비우면 DB 전체 기간)'
        required: false
        default: ''
      end_date:
        description: '종료일 (YYYYMMDD, 비우면 start_date와 동일)'
        required: false
        default: ''
      portfolio_only:
        description: '포트폴리오(가상매매)만 다시 계산 — 지표·신호 계산 생략(가볍다). 넓은 기간 신호 기록용'
        type: boolean
        required: false
        default: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 2026-10-25: 계산은 한 번에 하나만 — 통합 파이프라인 안의 계산(workflow_call)과
    # 수동 실행이 같은 날짜·같은 테이블에 동시에 쓰지 않도록 줄 세움. (job 단위라 통합 파이프라인에서 호출될 때도 적용)
    # 대기가 여러 개 쌓이면 GitHub이 오래된 대기를 취소하지만, 계산은 '오늘 하루치'를 처음부터 다시 만드는 작업이라
    # 뒤에 온 계산이 앞의 것을 대신하므로 결과에는 영향 없음.
    concurrency:
      group: compute-db-write
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="$(bash .github/scripts/holidays.sh)"   # 휴장일은 .github/holidays.txt 한 곳에서 관리
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 이후 단계를 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: steps.market_day.outputs.is_market_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.market_day.outputs.is_market_day == 'true'
        run: pip install psycopg2-binary

      - name: Compute
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ "${{ inputs.daily }}" = "true" ]; then
            # 일일 파이프라인(수집 직후): 오늘 또는 지정한 날짜 하루치 지표·신호 계산 + 가상매수/매도 실행
            D="${{ inputs.date }}"; [ -z "$D" ] && D="$(date +%Y%m%d)"
            NP=""; [ "${{ inputs.no_portfolio }}" = "true" ] && NP="--no-portfolio"
            python 05_compute.py "$D" $NP
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # (예전) 16:30 KST 하나뿐 — 지표·신호 계산 + 실제 가상매수/매도 실행.
            python 05_compute.py "$(date +%Y%m%d)"
          else
            START="${{ github.event.inputs.start_date }}"
            END="${{ github.event.inputs.end_date }}"
            FLAG=""
            if [ "${{ github.event.inputs.portfolio_only }}" = "true" ]; then FLAG="--portfolio-only"; fi
            if [ -z "$START" ]; then
              python 05_compute.py $FLAG
            elif [ -z "$END" ]; then
              python 05_compute.py "$START" $FLAG
            else
              python 05_compute.py "$START" "$END" $FLAG
            fi
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="지표·신호 계산 실패! GitHub Actions 로그를 확인하세요."
          echo "::error::$MSG"
          # 2026-09-12: ::error:: 주석은 GitHub Actions 로그를 직접 열어보지 않으면
          # 아무도 못 보므로, relay-server가 이미 쓰는 것과 같은 텔레그램 봇으로 실제
          # 알림을 보냅니다. 리포지토리 시크릿에 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID를
          # 등록해야 동작하고(둘 다 relay-server Render 환경변수와 같은 값 사용 가능),
          # 등록 전까지는 예전처럼 ::error:: 로그만 남습니다.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true
          fi
