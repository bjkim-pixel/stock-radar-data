name: "[점검] SK바이오팜 손익비 재현 | 수동 | 읽기 전용"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary
      - run: python 191_diag_sk.py 2>&1
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: diag-sk-report
          file: diag_sk.md
