name: "[점검] 사이트 요청 성능 측정 | 수동 | 읽기 전용"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python 126_perf_probe.py
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: perf-probe-report
          file: perf_probe_report.md
