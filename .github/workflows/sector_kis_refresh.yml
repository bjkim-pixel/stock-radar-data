name: Sector Classification (KIS) — 갱신·CSV·디버그

# 2026-10-25: "Sector Snapshot"과 이 워크플로를 하나로 합쳤습니다(둘 다 21_sector_kis_refresh.py를 쓰는 수동 실행 도구).
# 실행 모드(수동 실행 화면에서 선택):
#   refresh_export — KIS에서 업종 분류를 새로 받고(sector_kis/sector_kis_lcls), CSV(reports/*.csv)로 내보내 커밋 (옛 Sector Snapshot 기본 동작)
#   refresh        — 업종 분류 갱신만
#   export_only    — 갱신 없이 현재 DB 기준 CSV 내보내기·미분류 종목 점검만 커밋
#   debug          — 한 종목의 KIS 응답 필드 확인(DB 변경 없음)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'refresh_export'
        type: choice
        options:
          - refresh_export
          - refresh
          - export_only
          - debug
      debug_code:
        description: 'debug 모드일 때 조회할 종목코드 (기본: 한국콜마 161890)'
        required: false
        default: '161890'

permissions:
  contents: write

concurrency:
  # KIS REST는 "초당 20건"이 앱키 단위 한도라서 종목 전체를 도는 수집 워크플로를 같은 group으로 줄 세웁니다.
  group: kis-rest-batch
  cancel-in-progress: false

jobs:
  sector:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 먼저 시작한 NXT 수집이 끝날 때까지 기다리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait_kis_turn.sh "nxt_collect.yml" 20

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Get shared KIS token (갱신 모드만 필요)
        id: kistoken
        if: ${{ inputs.mode == 'refresh_export' || inputs.mode == 'refresh' }}
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_TOKEN_ISSUER: "gha:${{ github.workflow }}"
        run: |
          # KIS 접근토큰은 앱키당 1분 1회만 발급되므로 Supabase kis_token 테이블에 저장해 모두가 나눠 씁니다(72_kis_token.py).
          TOKEN=$(python 72_kis_token.py)
          if [ -z "$TOKEN" ]; then
            echo "::error::KIS 토큰 획득 실패"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run (debug — 필드명 확인용, DB 변경 없음)
        if: ${{ inputs.mode == 'debug' }}
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python 21_sector_kis_refresh.py --debug "${{ inputs.debug_code }}"

      - name: Refresh sector_kis / sector_kis_lcls (전 종목, 약 1~2분)
        if: ${{ inputs.mode == 'refresh_export' || inputs.mode == 'refresh' }}
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: python 21_sector_kis_refresh.py

      - name: Export sector snapshot CSV
        if: ${{ inputs.mode == 'refresh_export' || inputs.mode == 'export_only' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p reports
          python 44_sector_snapshot_export.py reports/sector_snapshot.csv

      - name: Check unclassified stocks (sector_override 미설정 종목 탐지)
        if: ${{ inputs.mode == 'refresh_export' || inputs.mode == 'export_only' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p reports
          python 46_sector_unclassified_check.py reports/sector_unclassified.csv

      - name: Commit snapshot
        if: ${{ inputs.mode == 'refresh_export' || inputs.mode == 'export_only' }}
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/sector_snapshot.csv reports/sector_unclassified.csv
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "업종 분류 스냅샷 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="업종 분류 작업 실패! GitHub Actions 로그를 확인하세요."
          echo "::error::$MSG"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true
          fi
