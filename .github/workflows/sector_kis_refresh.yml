name: "[수시] 업종 관리 | 수동 | 업종 분류 갱신·CSV·일괄 지정"

# 2026-10-25: "Sector Snapshot"과 이 워크플로를 하나로 합쳤습니다(둘 다 21_sector_kis_refresh.py를 쓰는 수동 실행 도구).
# 실행 모드(수동 실행 화면에서 선택):
#   refresh_export — KIS에서 업종 분류를 새로 받고(sector_kis/sector_kis_lcls), CSV(reports/*.csv)로 내보내 커밋 (옛 Sector Snapshot 기본 동작)
#   refresh        — 업종 분류 갱신만
#   export_only    — 갱신 없이 현재 DB 기준 CSV 내보내기·미분류 종목 점검만 커밋
#   debug          — 한 종목의 KIS 응답 필드 확인(DB 변경 없음)
#   set_sectors    — 미분류 종목에 업종 일괄 지정(예전 Set Stock Sectors; sector_override 저장, KIS 호출 없음). 사용법:
#       1) entries를 비워 실행 → '지금 미분류인 종목'과 '쓸 수 있는 업종 이름' 표시  2) entries에 "종목=업종; 종목=업종" + dry_run=true → 검증만  3) 문제없으면 dry_run=false → 저장
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'refresh_export'
        type: choice
        options:
          - refresh_export
          - refresh
          - export_only
          - debug
          - set_sectors
      debug_code:
        description: 'debug 모드일 때 조회할 종목코드 (기본: 한국콜마 161890)'
        required: false
        default: '161890'
      entries:
        description: '(set_sectors) 종목=업종; 종목=업종 … (종목은 이름 또는 6자리 코드, 예: 엑시콘=반도체; 지투지바이오=제약). 비우면 미분류 목록만 표시'
        required: false
        default: ''
      lookup:
        description: '(set_sectors) 업종 값을 점검할 종목 이름들 — 예: 엑시콘, 지투지바이오. 비우면 최근 추가 종목 20개만 점검'
        required: false
        default: ''
      dry_run:
        description: '(set_sectors) 미리보기만(저장 안 함) — 확인 후 false로 다시 실행하면 저장'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  # KIS REST는 "초당 20건"이 앱키 단위 한도라서 종목 전체를 도는 수집 워크플로를 같은 group으로 줄 세웁니다.
  # set_sectors 모드는 KIS를 쓰지 않으므로 줄 세우지 않고 실행마다 따로 돕니다.
  group: ${{ inputs.mode == 'set_sectors' && format('sector-set-{0}', github.run_id) || 'kis-rest-batch' }}
  cancel-in-progress: false

jobs:
  sector:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Get shared KIS token (갱신 모드만 필요)
        id: kistoken
        if: ${{ inputs.mode == 'refresh_export' || inputs.mode == 'refresh' }}
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_TOKEN_ISSUER: "gha:${{ github.workflow }}"
        run: |
          # KIS 접근토큰은 앱키당 1분 1회만 발급되므로 Supabase kis_token 테이블에 저장해 모두가 나눠 씁니다(72_kis_token.py).
          TOKEN=$(python 72_kis_token.py)
          if [ -z "$TOKEN" ]; then
            echo "::error::KIS 토큰 획득 실패"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run (debug — 필드명 확인용, DB 변경 없음)
        if: ${{ inputs.mode == 'debug' }}
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python 21_sector_kis_refresh.py --debug "${{ inputs.debug_code }}"

      - name: Refresh sector_kis / sector_kis_lcls (전 종목, 약 1~2분)
        if: ${{ inputs.mode == 'refresh_export' || inputs.mode == 'refresh' }}
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: python 21_sector_kis_refresh.py

      - name: Export sector snapshot CSV
        if: ${{ inputs.mode == 'refresh_export' || inputs.mode == 'export_only' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p reports
          python 44_sector_snapshot_export.py reports/sector_snapshot.csv

      - name: Check unclassified stocks (sector_override 미설정 종목 탐지)
        if: ${{ inputs.mode == 'refresh_export' || inputs.mode == 'export_only' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p reports
          python 46_sector_unclassified_check.py reports/sector_unclassified.csv

      - name: Commit snapshot
        if: ${{ inputs.mode == 'refresh_export' || inputs.mode == 'export_only' }}
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/sector_snapshot.csv reports/sector_unclassified.csv
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "업종 분류 스냅샷 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      - name: Set sectors (업종 일괄 지정 — DB만 사용)
        if: ${{ inputs.mode == 'set_sectors' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ENTRIES: ${{ inputs.entries }}
          DRY_RUN: ${{ inputs.dry_run }}
          LOOKUP: ${{ inputs.lookup }}
        run: python 89_set_sectors.py --report sector_report.md

      - name: Publish sector report
        if: ${{ always() && inputs.mode == 'set_sectors' }}
        uses: ./.github/actions/publish-report
        with:
          branch: sector-report
          file: sector_report.md

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="업종 분류 작업 실패! GitHub Actions 로그를 확인하세요."
          echo "::error::$MSG"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true
          fi
