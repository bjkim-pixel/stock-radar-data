name: "[수시] DB 테이블·뷰 생성 | 수동 | 스키마 설정"

# 예전의 Setup Journal / Setup Access Log / Setup KOSPI Flow View / Setup Watchlist 를 하나로 합쳤습니다.
# 모두 여러 번 실행해도 안전합니다(create if not exists). 수동 실행 화면에서 대상을 고르세요.
#   journal    — 투자일지 테이블(94_journal.sql)
#   access_log — 접속 기록 테이블(92_access_log.sql)
#   kospi_flow — 수급 일별 뷰 v_kospi_flow_daily(95_kospi_flow.sql)
#   watchlist  — 관심·투자 종목 테이블 my_watchlist(117_watchlist.sql)
#   data_version — 화면 요청 캐시용 데이터 버전 함수(128_data_version.sql)
#   flow_periods_fast — v_stock_flow_periods 속도 개선(129, 결과 동일할 때만 교체 · all 에 포함 안 됨)
#   trade_security — 매매 보안 1/2: 감사 기록 테이블 + 소유자 확인 함수(160, 화면 영향 없음 · all 에 포함 안 됨)
#   lock_data  — 매매 보안 2/2: 데이터 읽기를 로그인한 주인에게만 허용(161 · all 에 포함 안 됨 · 로그인 확인 후 실행)
#   unlock_data — 위 잠금 되돌리기(all 에 포함 안 됨)
#   all        — 위 전부 (drop_nxt 는 포함되지 않음)
#   drop_nxt   — daily_price 의 NXT 컬럼 4개 삭제(120_drop_nxt_columns.sql, 되돌릴 수 없음 · all 에 포함 안 됨)
on:
  workflow_dispatch:
    inputs:
      target:
        description: '만들 대상'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - journal
          - access_log
          - kospi_flow
          - watchlist
          - data_version
          - flow_periods_fast
          - drop_nxt
          - trade_security
          - lock_data
          - unlock_data

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - name: journal_entries (투자일지)
        if: inputs.target == 'all' || inputs.target == 'journal'
        run: python 94_journal_setup.py
      - name: access_log (접속 기록)
        if: inputs.target == 'all' || inputs.target == 'access_log'
        run: python 92_access_log_setup.py
      - name: v_kospi_flow_daily (수급 일별 뷰)
        if: inputs.target == 'all' || inputs.target == 'kospi_flow'
        run: python 95_kospi_flow_setup.py
      - name: my_watchlist (관심·투자 종목)
        if: inputs.target == 'all' || inputs.target == 'watchlist'
        run: python 117_watchlist_setup.py
      - name: data_version() (화면 캐시용 데이터 버전)
        if: inputs.target == 'all' || inputs.target == 'data_version'
        run: python 128_data_version_setup.py
      - name: v_stock_flow_periods 속도 개선(검증 후 교체)
        if: inputs.target == 'flow_periods_fast'
        run: python 129_flow_periods_fast.py
      - name: daily_price NXT 컬럼 삭제 (되돌릴 수 없음)
        if: inputs.target == 'drop_nxt'
        run: |
          python - <<'PY'
          import os, psycopg2
          sql = open("120_drop_nxt_columns.sql", encoding="utf-8").read()
          conn = psycopg2.connect(os.environ["SUPABASE_DB_URL"])
          cur = conn.cursor()
          cur.execute(sql)       # begin/commit 포함 — 오류 시 전체 취소
          cur.execute("select column_name from information_schema.columns where table_name='daily_price' and column_name like 'nxt%'")
          print("남은 NXT 컬럼:", cur.fetchall())
          conn.commit(); conn.close()
          PY
      - name: Publish kospi-flow report
        if: always() && (inputs.target == 'all' || inputs.target == 'kospi_flow')
        uses: ./.github/actions/publish-report
        with:
          branch: kospi-flow-report
          file: kospi_flow_report.md
      - name: Publish db-setup report
        if: always() && (inputs.target == 'data_version' || inputs.target == 'flow_periods_fast')
        uses: ./.github/actions/publish-report
        with:
          branch: db-setup-report
          file: ${{ inputs.target == 'data_version' && 'data_version_report.md' || 'flow_periods_fast_report.md' }}
      - name: 매매 보안 (감사 테이블·소유자 함수 / 데이터 잠금 / 잠금 해제)
        if: inputs.target == 'trade_security' || inputs.target == 'lock_data' || inputs.target == 'unlock_data'
        run: python 160_trade_setup.py ${{ inputs.target }}
