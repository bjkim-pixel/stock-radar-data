name: Daily Stock Summary to Telegram

# 거래일마다 relay-server(Render)의 /trigger-daily-summary 엔드포인트를 호출해서, 사이트의 "오늘의 종목" 탭과
# 같은 로직으로 계산한 요약(시장 요약·섹터RS 상위·수급 상위 종목·종합스코어 Top10)을 텔레그램으로 보냅니다.
# HTTP 요청 자체가 슬립 중인 Render 서버를 깨우는 역할도 합니다(콜드스타트 30~50초 감안해 넉넉히 대기).
#
# 2026-10-25: 16:10 고정 예약 → "수집·계산 통합 워크플로가 계산까지 성공한 직후" 하루 1번으로 변경.
#   예전엔 16:05 수집·계산이 끝나기 전에 보내져 그날 계산이 빠진 요약이 갈 수 있었음.
#   20:40 KST 예약은 보조 — 그때까지 연결 발송이 한 번도 안 됐을 때만 보냄. 수동 실행(Run workflow)은 언제나 발송.
on:
  workflow_run:
    workflows: ["Daily Collect + Compute (수집·계산 통합)"]
    types: [completed]
  schedule:
    - cron: "40 11 * * 1-5"   # 20:40 KST 보조
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: 발송 여부 판단 (거래일·계산 성공·오늘 첫 발송)
        id: market_day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EV="${{ github.event_name }}"
          if [ "$EV" = "workflow_dispatch" ]; then echo "is_market_day=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          skip(){ echo "⏸️ $1 — 건너뜁니다"; echo "is_market_day=false" >> "$GITHUB_OUTPUT"; exit 0; }
          TODAY=$(TZ=Asia/Seoul date +%F); DOW=$(TZ=Asia/Seoul date +%u)
          HOLIDAYS="$(bash .github/scripts/holidays.sh)"   # 휴장일은 .github/holidays.txt 한 곳에서 관리
          if [ "$DOW" -ge 6 ] || echo " $HOLIDAYS " | grep -q " $TODAY "; then skip "$TODAY 은 주말/휴장일"; fi
          if [ "$EV" = "workflow_run" ]; then
            [ "${{ github.event.workflow_run.conclusion }}" = "success" ] || skip "수집·계산이 성공하지 않음"
            # 수집만 하고 계산을 건너뛴 실행(skip_compute)이면 보내지 않음 — 계산 job이 success인지 확인
            C=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
                --jq '[.jobs[] | select((.name|startswith("compute")) and .conclusion=="success")] | length' 2>/dev/null || echo 0)
            [ "${C:-0}" -gt 0 ] || skip "이번 실행은 계산 단계가 없음(수집만)"
          fi
          N=$(bash .github/scripts/done_today.sh daily_summary_trigger.yml "Trigger daily summary (최대 3회 재시도)")
          [ "${N:-0}" -gt 0 ] && skip "오늘 이미 ${N}번 발송함"
          echo "is_market_day=true" >> "$GITHUB_OUTPUT"

      - name: Trigger daily summary (최대 3회 재시도)
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          TOKEN: ${{ secrets.DAILY_SUMMARY_TOKEN }}
        run: |
          # Supabase 뷰(v_market_flow_periods 등) 쿼리가 가끔 몇 초 걸려서
          # PostgREST statement timeout(500)에 걸릴 때가 있어 재시도를 둡니다.
          for i in 1 2 3; do
            STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 90 \
              "https://kis-relay-server.onrender.com/trigger-daily-summary?token=${TOKEN}")
            echo "시도 $i — HTTP status: $STATUS"
            cat /tmp/resp.json 2>/dev/null || true
            echo ""
            if [ "$STATUS" == "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::오늘의 종목 요약 트리거 3회 모두 실패 (마지막 status=$STATUS)"
          exit 1
