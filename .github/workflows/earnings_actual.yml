name: "[수집] 종목 확정 실적 | 실적 시즌에만(5·8·11월 1~20일, 2~3월, 4월 초) | KIS"
# 확정 구간(분기 2026Q2 이하·연간 2025 이하)은 DB에 고정 — 이 워크플로는 그 구간을 갱신하지 않고,
# 새로 공시된 분기(2026Q3~)와 신규 종목의 최초 적재만 합니다.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '테스트용 종목 수 제한(0=전체)'
        default: '0'
  schedule:
    - cron: '30 11 1-20 5,8,11 *'   # 20:30 KST — 1·2·3분기 보고서(분기말+45일)
    - cron: '30 11 * 2,3 *'        # 20:30 KST  4분기 잠정실적(2월)·사업보고서(3월 말)
    - cron: '30 11 1-10 4 *'       # 20:30 KST  사업보고서 지연분
permissions:
  contents: write
concurrency:
  group: kis-rest-batch
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - name: Collect (actual)
        run: python 125_earnings_collect.py actual "${{ github.event.inputs.limit || '0' }}"
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: earnings-actual-report
          file: earnings_actual_report.md
