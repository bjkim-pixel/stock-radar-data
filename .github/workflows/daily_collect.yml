name: Daily KIS Collection

on:
  schedule:
    # 2026-09-11 변경: 16:05/20:05 하루 2회 → 16:05~20:05 사이 30분 간격(총 9회)으로
    # 확대. 이유는 기존과 동일하게 'NXT 마감가'를 새로 받아오려는 게 아니라(아래
    # 주의사항 참고), KIS 장마감 배치가 드물게 늦게 확정/정정되는 경우를 더 빨리
    # 잡아내기 위함 — 하루 2번의 스팟체크보다 30분 간격으로 반복 확인하면 정정을
    # 더 일찍 반영할 수 있음. 매번 같은(trade_date, code) UPSERT라 중복 실행 안전.
    #
    # 매 거래일 16:05 KST = 07:05 UTC (월~금) — 정규장(15:30) 마감 확정 직후
    # ~ 19:35 KST = 10:35 UTC 까지 30분 간격
    # 주의: KIS 국내주식 시세 API는 정규장 15:20~15:30 동시호가에서 확정된 공식 종가/지수를
    # 돌려주며, NXT는 KRX와 별개 대체거래소라 이 값에는 반영되지 않습니다. 즉 16:05 이후
    # 반복 실행은 'NXT 마감가'가 아니라 16:05 실행과 같은 정규장 마감 데이터를 다시 확인하는
    # 안전판(KIS 장마감 배치가 드물게 늦게 확정/정정되는 경우 대비) 성격입니다.
    - cron: "5,35 7-10 * * 1-5"
    # 매 거래일 20:05 KST = 11:05 UTC (월~금) — 넥스트레이드(NXT) 애프터마켓(~20:00) 종료 후,
    # 위와 같은 이유의 마지막 확인 실행 (20:35은 필요 없어 제외)
    - cron: "5 11 * * 1-5"
  workflow_dispatch:
    # 수동 실행 (GitHub 웹에서 "Run workflow" 버튼)
    inputs:
      target_date:
        description: '수집 날짜 (YYYYMMDD, 비우면 오늘)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 이후 단계를 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: steps.market_day.outputs.is_market_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.market_day.outputs.is_market_day == 'true'
        run: pip install psycopg2-binary requests

      - name: Get shared KIS token
        id: kistoken
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          # KIS는 앱키당 토큰 발급을 1분에 1회로 제한합니다.
          # 이 스텝에서 딱 한 번만 발급받아 아래 두 파이썬 스텝이 공유합니다
          # (각자 발급받으면 두 번째 요청이 403으로 막힙니다).
          #
          # 2026-09-11: GitHub Actions 러너가 전 세계 무작위 리전에 배정되다 보니
          # 어쩌다 KIS 서버로의 네트워크 경로가 느린/막힌 리전에 걸리면 --max-time
          # 없는 curl이 2분 넘게 응답 없이 멈췄다가 exit 28로 실패하는 경우가 있어
          # (GitHub Actions 실패 로그 확인 결과) 타임아웃 + 짧은 재시도를 추가함.
          TOKEN=""
          for i in 1 2 3; do
            RESP=$(curl -s --connect-timeout 8 --max-time 20 -X POST "https://openapi.koreainvestment.com:9443/oauth2/tokenP" \
              -H "Content-Type: application/json" \
              -d "{\"grant_type\":\"client_credentials\",\"appkey\":\"$KIS_APP_KEY\",\"appsecret\":\"$KIS_APP_SECRET\"}")
            TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
            if [ -n "$TOKEN" ]; then
              break
            fi
            echo "KIS 토큰 발급 재시도 ($i/3) — 5초 후 재시도: $RESP"
            sleep 5
          done
          if [ -z "$TOKEN" ]; then
            echo "::error::KIS 토큰 발급 실패: $RESP"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run collection
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: |
          DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$DATE" ]; then
            python 03_daily_collect.py
          else
            python 03_daily_collect.py "$DATE"
          fi

      - name: Run program-trade / US market collection
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: |
          DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$DATE" ]; then
            python 20_collect_market_extra.py
          else
            python 20_collect_market_extra.py "$DATE"
          fi

      - name: Notify on failure
        if: failure()
        run: echo "::error::일별 수집 실패! GitHub Actions 로그를 확인하세요."
