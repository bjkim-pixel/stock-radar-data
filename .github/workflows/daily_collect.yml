name: Daily KIS Collection

on:
  schedule:
    # 매 거래일 16:05 KST = 07:05 UTC (월~금) — 정규장(15:30) 마감 확정 직후
    - cron: "5 7 * * 1-5"
    # 매 거래일 20:05 KST = 11:05 UTC (월~금) — 넥스트레이드(NXT) 애프터마켓(~20:00) 종료 후
    # 주의: KIS 국내주식 시세 API는 정규장 15:20~15:30 동시호가에서 확정된 공식 종가/지수를
    # 돌려주며, NXT는 KRX와 별개 대체거래소라 이 값에는 반영되지 않습니다. 즉 이 두 번째
    # 실행은 'NXT 마감가'가 아니라 16:05 실행과 같은 정규장 마감 데이터를 다시 확인하는
    # 안전판(KIS 장마감 배치가 드물게 늦게 확정/정정되는 경우 대비) 성격입니다.
    - cron: "5 11 * * 1-5"
  workflow_dispatch:
    # 수동 실행 (GitHub 웹에서 "Run workflow" 버튼)
    inputs:
      target_date:
        description: '수집 날짜 (YYYYMMDD, 비우면 오늘)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary requests

      - name: Get shared KIS token
        id: kistoken
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          # KIS는 앱키당 토큰 발급을 1분에 1회로 제한합니다.
          # 이 스텝에서 딱 한 번만 발급받아 아래 두 파이썬 스텝이 공유합니다
          # (각자 발급받으면 두 번째 요청이 403으로 막힙니다).
          RESP=$(curl -s -X POST "https://openapi.koreainvestment.com:9443/oauth2/tokenP" \
            -H "Content-Type: application/json" \
            -d "{\"grant_type\":\"client_credentials\",\"appkey\":\"$KIS_APP_KEY\",\"appsecret\":\"$KIS_APP_SECRET\"}")
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "::error::KIS 토큰 발급 실패: $RESP"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run collection
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: |
          DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$DATE" ]; then
            python 03_daily_collect.py
          else
            python 03_daily_collect.py "$DATE"
          fi

      - name: Run program-trade / US market collection
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: |
          DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$DATE" ]; then
            python 20_collect_market_extra.py
          else
            python 20_collect_market_extra.py "$DATE"
          fi

      - name: Notify on failure
        if: failure()
        run: echo "::error::일별 수집 실패! GitHub Actions 로그를 확인하세요."
