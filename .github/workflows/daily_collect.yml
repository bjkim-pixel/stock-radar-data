name: Daily Collect + Compute (수집·계산 통합)

on:
  schedule:
    # 2026-09-11 변경: 16:05/20:05 하루 2회 → 16:05~20:05 사이 30분 간격(총 9회)으로
    # 확대. 이유는 기존과 동일하게 'NXT 마감가'를 새로 받아오려는 게 아니라(아래
    # 주의사항 참고), KIS 장마감 배치가 드물게 늦게 확정/정정되는 경우를 더 빨리
    # 잡아내기 위함 — 하루 2번의 스팟체크보다 30분 간격으로 반복 확인하면 정정을
    # 더 일찍 반영할 수 있음. 매번 같은(trade_date, code) UPSERT라 중복 실행 안전.
    #
    # 2026-09-23 재축소: 9회 → 2회(16:05, 18:05). 매번 302개 종목 전체를
    # daily_price/daily_flow/daily_program 3개 테이블에 다시 upsert하는 이
    # 워크플로가 하루 중 가장 무거운 반복 부하였음(Supabase nano 무료 인스턴스
    # Disk IO 버스트 크레딧 고갈로 인한 장애의 주요 원인으로 확인됨). 20:05
    # 실행은 원래도 NXT 마감가를 받는 게 아니라 16:05와 같은 정규장 데이터를
    # 한 번 더 확인하는 안전판이었을 뿐이라(아래 주의사항 참고) 빼도 기능
    # 손실 없음 — "드문 정정을 더 일찍 잡는다"는 목적은 16:05·18:05 두 번으로도
    # 충분히 달성됨.
    #
    # 매 거래일 16:05 KST = 07:05 UTC (월~금) — 정규장(15:30) 마감 확정 직후
    # 18:05 KST = 09:05 UTC — 마지막 재확인
    # 주의: KIS 국내주식 시세 API는 정규장 15:20~15:30 동시호가에서 확정된 공식 종가/지수를
    # 돌려주며, NXT는 KRX와 별개 대체거래소라 이 값에는 반영되지 않습니다. 즉 16:05 이후
    # 반복 실행은 'NXT 마감가'가 아니라 16:05 실행과 같은 정규장 마감 데이터를 다시 확인하는
    # 안전판(KIS 장마감 배치가 드물게 늦게 확정/정정되는 경우 대비) 성격입니다.
    #
    # 2026-10-25: 수집 → 지표·신호 계산을 한 워크플로로 합쳤습니다(아래 compute 잡). 시각은 16:05·17:05·18:05·19:05 KST
    # (= 07/08/09/10:05 UTC, 월~금)로 한 시간 간격 4회. 같은 날 여러 번 돌아도 upsert라 안전하고, 매 회 끝에 계산이 이어집니다.
    # ⚠ GitHub 예약 실행은 큐가 밀리면 몇 시간씩 늦게 시작될 수 있습니다(실측: 16시 예약이 밤 11시경 실행).
    #   정각에 확실히 돌리려면 이미 쓰는 cron-job.org에 작업 4개(월~금 16:05·17:05·18:05·19:05 KST)를 만들어
    #   POST https://api.github.com/repos/bjkim-pixel/stock-radar-data/actions/workflows/daily_collect.yml/dispatches
    #   헤더 Authorization: Bearer <이 저장소 전용 fine-grained 토큰(Actions: Read and write)>, Accept: application/vnd.github+json
    #   본문 {"ref":"main"} 으로 호출하게 하세요. (예약 실행과 겹쳐도 upsert라 안전하고, 겹치면 줄을 서서 차례로 실행됩니다.)
    - cron: "5 7,8,9,10 * * 1-5"
  workflow_dispatch:
    # 수동 실행 (GitHub 웹에서 "Run workflow" 버튼)
    inputs:
      target_date:
        description: '수집 날짜 (YYYYMMDD, 비우면 오늘)'
        required: false
        default: ''
      skip_compute:
        description: '수집만 하고 지표·신호 계산은 건너뜀'
        type: boolean
        required: false
        default: false

concurrency:
  # 2026-09-15: KIS REST는 "초당 20건"이 앱키 단위 한도라서, 종목 전체를 도는
  # 수집 워크플로가 둘 이상 동시에 돌면 각자 한도 안이어도 합산에서 초과한다
  # (실제로 daily_collect :05/:35 와 intraday_collect :00/:30 는 각 실행이
  # 7~10분 걸려 매 30분마다 2분가량 겹쳤다). 같은 group을 쓰면 GitHub이
  # 뒤에 온 실행을 앞 실행이 끝날 때까지 대기시켜 겹침 자체가 사라진다.
  # cancel-in-progress: false — 진행 중인 수집을 죽이지 않고 줄을 세운다.
  group: kis-rest-batch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 이후 단계를 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: steps.market_day.outputs.is_market_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.market_day.outputs.is_market_day == 'true'
        run: pip install psycopg2-binary requests

      - name: Get shared KIS token
        id: kistoken
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_TOKEN_ISSUER: "gha:${{ github.workflow }}"
        run: |
          # 2026-09-15: 실행할 때마다 직접 발급하던 curl을 공유 캐시 방식으로 교체.
          # KIS는 접근토큰을 앱키당 1분 1회만 발급해 주는데, 워크플로 5개 + 릴레이
          # 서버가 각자 발급하다 보니 스케줄이 겹치는 순간 한쪽이 403 EGW00133으로
          # 막혔다. 토큰은 24시간 유효하므로 Supabase kis_token 테이블에 저장해
          # 모두가 나눠 쓴다(72_kis_token.py). 테이블이 없거나 DB가 막히면 예전처럼
          # 직접 발급으로 자동 폴백하므로 이 변경만으로 깨지지 않는다.
          TOKEN=$(python 72_kis_token.py)
          if [ -z "$TOKEN" ]; then
            echo "::error::KIS 토큰 획득 실패"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run collection
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: |
          DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$DATE" ]; then
            python 03_daily_collect.py
          else
            python 03_daily_collect.py "$DATE"
          fi

      - name: Run program-trade / US market collection
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: |
          DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$DATE" ]; then
            python 20_collect_market_extra.py
          else
            python 20_collect_market_extra.py "$DATE"
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="일별 수집 실패! GitHub Actions 로그를 확인하세요."
          echo "::error::$MSG"
          # 2026-09-12: ::error:: 주석은 GitHub Actions 로그를 직접 열어보지 않으면
          # 아무도 못 보므로, relay-server가 이미 쓰는 것과 같은 텔레그램 봇으로 실제
          # 알림을 보냅니다. 리포지토리 시크릿에 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID를
          # 등록해야 동작하고(둘 다 relay-server Render 환경변수와 같은 값 사용 가능),
          # 등록 전까지는 예전처럼 ::error:: 로그만 남습니다.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true
          fi

  # 수집이 끝나면 같은 실행 안에서 지표·신호 계산(05_compute.py)을 이어서 실행 — 두 워크플로를 따로 누르던 번거로움 제거.
  # 수집이 실패하면 계산은 건너뜁니다. 휴장일이면 수집 잡이 스킵되고 계산 잡도 스스로 휴장일을 감지해 건너뜁니다.
  compute:
    needs: collect
    if: needs.collect.result == 'success' && github.event.inputs.skip_compute != 'true'
    uses: ./.github/workflows/compute.yml
    secrets: inherit
    with:
      daily: true
      date: ${{ github.event.inputs.target_date }}
