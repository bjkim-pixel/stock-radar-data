name: AI Daily Brief (AI 브리핑)

# 장마감 후 하루 2회: 16시 데이터(1회차) · 18시 데이터(2회차).
# daily_collect.yml(수집·계산) after 잡이 계산 성공 직후 이 워크플로를 실행합니다.
# 실행되면 먼저 같은 시점에 시작된 후속 계산(업종 수급·스마트머니·시총대비 수급·글로벌 팩)이 끝날 때까지 기다린 뒤 생성합니다.
# 같은 날짜·회차가 이미 성공(ok)했으면 113_ai_brief.py가 알아서 건너뜁니다(17시·19시 실행은 대부분 건너뜀).
# 수동 실행: round 1/2 선택 + force로 다시 생성.
on:
  workflow_dispatch:
    inputs:
      round:
        description: '회차 (auto=지금 시각 기준, 1=16시 데이터, 2=18시 데이터)'
        required: false
        default: 'auto'
      force:
        description: '이미 있어도 다시 생성'
        type: boolean
        required: false
        default: false
      min_amt:
        description: '후보 최소 거래대금(억원, 비우면 기본값 300)'
        required: false
        default: ''
      sim:
        description: '시뮬레이션만(저장·AI 호출 없이 후보 순위 리포트)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: ai-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 후속 계산이 끝날 때까지 대기 (최대 25분)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 50); do
            BUSY=0
            for wf in sector_flow_daily.yml smart_money.yml flow_cap_ratio.yml global_collect.yml daily_collect.yml; do
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=5" \
                   --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length' 2>/dev/null || echo 0)
              [ "${n:-0}" -gt 0 ] && { BUSY=1; echo "⏳ $wf 진행 중"; }
            done
            [ $BUSY -eq 0 ] && { echo "✅ 후속 계산 완료 — 생성 시작"; break; }
            sleep 30
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary requests
      - name: Generate brief
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          F=""; [ "${{ github.event.inputs.force }}" = "true" ] && F="--force"
          [ "${{ github.event.inputs.sim }}" = "true" ] && F="$F --sim"
          [ -n "${{ github.event.inputs.min_amt }}" ] && F="$F --min-amt ${{ github.event.inputs.min_amt }}"
          python 113_ai_brief.py --round "${{ github.event.inputs.round || 'auto' }}" $F --dump --report brief_report.md
      - name: Publish report (branch ai-brief-report)
        if: always()
        run: |
          [ -f brief_report.md ] || echo "리포트 없음 — 실패. Actions 로그 확인" > brief_report.md
          cp brief_report.md /tmp/brief_report.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ai-brief-report
          git rm -rq --cached . || true
          cp /tmp/brief_report.md brief_report.md
          git add -f brief_report.md
          git commit -qm "ai brief report ${{ github.run_id }}"
          git push -f origin ai-brief-report
