name: Keep KIS Relay Server Awake

# 이 워크플로의 역할은 2026-09-15부터 "10분마다 깨어있게 유지"가 아니라
# **잠든 인스턴스를 깨우는 예비 수단**이었습니다.
#
# 2026-09-23: 이 핑을 cron-job.org(외부 무료 크론 서비스)로 완전히 옮겼습니다
# (https://kis-relay-server.onrender.com/health, 10분 간격, 200 OK 확인됨).
# GitHub Actions 스케줄은 "예약된" 횟수만으로도 레포 전체 스케줄 큐에 부담을 줘
# 다른 워크플로(nxt_collect 등)의 지연을 키우는 것으로 확인돼(2026-09-22),
# 이 워크플로의 스케줄을 아예 제거합니다 — 이제 GitHub Actions 쪽 예약 발화는
# 0입니다. 아래는 수동 실행(workflow_dispatch)으로만 남겨둡니다(비상시 대비).
#
# 상시 유지는 여전히 server.js의 셀프 핑(startSelfPing, 4분 간격)이 1차로
# 맡고, cron-job.org가 "이미 잠든 인스턴스를 깨우는" 역할을 이어받았습니다.

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6   # 최대 3회 × (60초 타임아웃 + 30초 대기)
    steps:
      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 핑을 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping relay server health endpoint (최대 3회 — 콜드 스타트 대비)
        if: steps.market_day.outputs.is_market_day == 'true'
        run: |
          # Render 무료 인스턴스가 잠들어 있으면 첫 요청은 30~50초 걸리거나
          # 타임아웃납니다. 깨우는 것이 목적이므로 실패해도 30초 뒤 재시도합니다.
          STATUS="000"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 \
              https://kis-relay-server.onrender.com/health || echo "000")
            echo "시도 $i/3 — HTTP status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              break
            fi
            sleep 30
          done
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "$STATUS" != "200" ]; then
            echo "::warning::릴레이 서버 health 체크 3회 모두 실패 (마지막 status=$STATUS)"
          fi
