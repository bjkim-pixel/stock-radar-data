name: Keep KIS Relay Server Awake

# 이 워크플로의 역할은 2026-09-15부터 "10분마다 깨어있게 유지"가 아니라
# **잠든 인스턴스를 깨우는 예비 수단**입니다. 이유:
#
#   실측(2026-09-03~09-15 실행 이력): 아래 크론은 하루 약 49회 발화하도록
#   적혀 있지만 실제로는 **하루 4~5회만** 발화했습니다. GitHub Actions의
#   schedule은 러너 부하에 따라 지연·유실되며, 특히 */10 같은 고빈도 크론은
#   대부분 버려집니다. 발화 시각도 00:53 / 01:17 / 03:18 / 08:48 / 10:43(UTC)
#   처럼 제멋대로라 "10분 간격"은 한 번도 지켜진 적이 없습니다.
#   → 따라서 간격을 5분으로 줄여도 효과가 없습니다. 크론을 촘촘하게 적는 것과
#     실제 발화 횟수는 무관합니다.
#
#   대신 상시 유지는 server.js의 셀프 핑(startSelfPing, 4분 간격)이 맡습니다.
#   Render 무료 플랜은 "외부 요청 15분 공백"에 잠들므로, 깨어 있는 동안
#   스스로 공개 URL을 호출하면 유휴 타이머가 계속 리셋됩니다.
#   다만 **이미 잠든 인스턴스는 스스로 깨어날 수 없으므로**, 그 경우를 위해
#   이 워크플로가 남아 있습니다. 콜드 스타트에 30~50초가 걸리므로 한 번의
#   실행에서 최대 3번(30초 간격) 재시도해 확실히 깨웁니다.
#
# ⚠ KST → UTC 변환 주의: KST는 UTC+9라서 "월~금 KST 07:40~15:40"은
#   UTC 기준으로는 "일~목 22:40~23:50" + "월~금 00:00~06:40" 두 구간으로 쪼개집니다.

on:
  schedule:
    - cron: "40,50 22 * * 0-4"     # KST 월~금 07:40, 07:50 (전날 UTC 22:40/22:50)
    - cron: "*/10 23 * * 0-4"      # KST 월~금 08:00~08:50 (전날 UTC 23:00~23:50)
    - cron: "*/10 0-5 * * 1-5"     # KST 월~금 09:00~14:50
    - cron: "0,10,20,30,40 6 * * 1-5"  # KST 월~금 15:00~15:40
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6   # 최대 3회 × (60초 타임아웃 + 30초 대기)
    steps:
      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 핑을 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping relay server health endpoint (최대 3회 — 콜드 스타트 대비)
        if: steps.market_day.outputs.is_market_day == 'true'
        run: |
          # Render 무료 인스턴스가 잠들어 있으면 첫 요청은 30~50초 걸리거나
          # 타임아웃납니다. 깨우는 것이 목적이므로 실패해도 30초 뒤 재시도합니다.
          STATUS="000"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 \
              https://kis-relay-server.onrender.com/health || echo "000")
            echo "시도 $i/3 — HTTP status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              break
            fi
            sleep 30
          done
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "$STATUS" != "200" ]; then
            echo "::warning::릴레이 서버 health 체크 3회 모두 실패 (마지막 status=$STATUS)"
          fi
