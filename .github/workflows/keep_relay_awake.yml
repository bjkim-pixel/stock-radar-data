name: Keep KIS Relay Server Awake

# Render 무료 플랜은 15분간 요청이 없으면 서비스가 슬립 모드로 들어갑니다.
# 슬립 상태에서 처음 요청이 오면 다시 깨어나는 데 30~50초 정도 걸려서,
# 장중에 실시간 시세 웹소켓이 붙는 순간 지연이 생길 수 있습니다.
# 이를 막기 위해 국내 정규장 시간에 10분 간격으로 /health 엔드포인트에 핑을 보내
# 서비스를 계속 깨어있는 상태로 유지합니다.
#
# ⚠ 2026-09 전략성과2(상따) 후보 엔진 추가 이후 시작 시각을 08:50 → 07:40으로
#   앞당김: server.js의 candidateEngineHeartbeat()가 PRE_MARKET(07:50)·NXT(08:40)
#   단계를 서버 프로세스 내부 setInterval로 실행하는데, 기존 08:50 시작 스케줄은
#   이 두 단계가 이미 지난 뒤에야 첫 핑을 보내는 셈이라 그 사이 서버가 슬립하면
#   두 단계가 늦게(다음 핑에야 재시도) 실행될 위험이 있었습니다. 07:40부터 10분
#   간격으로 깨워두면 PRE_MARKET·NXT 실행 시점에 항상 깨어있는 상태가 보장됩니다.
#
# ⚠ KST → UTC 변환 주의: KST는 UTC+9라서 "월~금 KST 07:40~15:40"은
#   UTC 기준으로는 "일~목 22:40~23:50" + "월~금 00:00~06:40" 두 구간으로 쪼개집니다.
on:
  schedule:
    - cron: "40,50 22 * * 0-4"     # KST 월~금 07:40, 07:50 (전날 UTC 22:40/22:50)
    - cron: "*/10 23 * * 0-4"      # KST 월~금 08:00~08:50 (전날 UTC 23:00~23:50)
    - cron: "*/10 0-5 * * 1-5"     # KST 월~금 09:00~14:50
    - cron: "0,10,20,30,40 6 * * 1-5"  # KST 월~금 15:00~15:40
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 핑을 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping relay server health endpoint
        if: steps.market_day.outputs.is_market_day == 'true'
        run: |
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 \
            https://kis-relay-server.onrender.com/health || echo "000")
          echo "HTTP status: $STATUS"
          cat /tmp/health.json 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then
            echo "::warning::릴레이 서버 health 체크 실패 (status=$STATUS) — 슬립에서 깨어나는 중일 수 있음"
          fi
