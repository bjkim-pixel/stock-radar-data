name: ETF Probe (국내 ETF 현황, 읽기 전용)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary requests
      - name: Probe
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 101_etf_probe.py
      - name: Publish report (branch etf-probe-report)
        if: always()
        run: |
          [ -f etf_probe_report.md ] || echo "리포트 없음 — 실패. Actions 로그 확인" > etf_probe_report.md
          cp etf_probe_report.md /tmp/etf_probe_report.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan etf-probe-report
          git rm -rq --cached . || true
          cp /tmp/etf_probe_report.md etf_probe_report.md
          git add -f etf_probe_report.md
          git commit -qm "etf probe ${{ github.run_id }}"
          git push -f origin etf-probe-report
