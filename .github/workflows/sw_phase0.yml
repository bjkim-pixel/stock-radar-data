name: "[점검] 횡보장 전략 0단계 — 데이터 확인·요인 검증 | 수동 | 읽기 전용"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kis-rest-batch
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests pandas numpy
      - run: python 143_sw_phase0.py 2>sw_err.txt | tee sw_phase0_report.md; echo "---" >> sw_phase0_report.md; tail -c 1500 sw_err.txt | grep -v "UserWarning\|pandas only supports\|read_sql" >> sw_phase0_report.md || true
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: sw-phase0-report
          file: sw_phase0_report.md
