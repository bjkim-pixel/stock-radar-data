name: Intraday Sangtta Candidates (전략성과2 후보)

# sangtta_virtual_trading_spec.md 1~3절의 3단계 후보 생성을 스케줄대로 실행합니다.
# intraday_candidates 테이블에 단계별(source)로 UPSERT됩니다.
#
# ⚠ KST → UTC 변환 (KST = UTC+9)
#   07:50 KST(장전)      = 전날 22:50 UTC → cron dow 0-4 (일~목)
#   08:40 KST(NXT 막판)  = 전날 23:40 UTC → cron dow 0-4 (일~목)
#   09:12 KST(정규장초반) = 당일 00:12 UTC → cron dow 1-5 (월~금)
#   09:00~15:55 KST(장중 연속 스캔, 5분 간격) = 당일 00:00~06:55 UTC → dow 1-5 (월~금)
#     (같은 UTC 날짜 구간이라 요일 이동 없음 — SCAN 단계 자체 내부에서도
#      09:15~15:20만 실제로 동작하도록 한 번 더 가드함, 크론 구간은 여유있게)
on:
  # 2026-09-11: 이 워크플로(PRE_MARKET/NXT/REGULAR/SCAN 3단계 후보 생성)는
  # relay-server/server.js의 candidateEngineHeartbeat()로 완전히 대체됨
  # (server.js 상단 "3-A2) 전략성과2(상따) 후보 발굴 엔진" 절 주석 참고,
  # 2026-09-09 전환). 그 사실을 모르고 이 스케줄이 계속 살아있어서 장중 5분
  # 간격으로 중복 실행되며 불필요한 Actions 사용량 + KIS 공유 토큰 요청을
  # 추가로 발생시키고(GitHub Actions 실패 로그의 EGW00133 "1분당 1회" 레이트
  # 리밋 충돌 원인 중 하나로 보임) 있었음이 확인되어 스케줄을 껐음.
  # 2026-09-16: **백업 경로로만** 스케줄을 되살림.
  #   릴레이가 이 단계들을 전담하는 구조는 그대로지만, 릴레이가 죽거나(무료 플랜
  #   인스턴스 순환) 잠들어 있으면 그날 후보가 아예 안 생기는 단일 장애점이었다.
  #   아래 두 번만 돌면서, 66_intraday_candidates.py에 --only-if-missing을 붙여
  #   **오늘자 해당 단계 후보가 이미 있으면 즉시 종료**한다 — 릴레이가 정상인
  #   날에는 DB 조회 한 번 하고 끝나므로 중복 생성도, KIS 호출 낭비도 없다.
  #
  #   장중 연속 스캔(SCAN, 1분 간격)은 GitHub Actions로 대체 불가라 넣지 않았다.
  #   또한 이 백업이 살리는 것은 **후보 목록뿐**이다 — 가상 매수/매도 자체는
  #   릴레이가 실시간 체결을 받아 처리하므로, 릴레이가 종일 죽어 있으면 그날
  #   거래는 없다. 거래 연속성까지 원하면 Render 유료 플랜이 답이다.
  schedule:
    - cron: "5 0 * * 1-5"    # 09:05 KST — PRE_MARKET 백업 (릴레이 07:50 실행 실패 시)
    - cron: "25 0 * * 1-5"   # 09:25 KST — REGULAR  백업 (릴레이 09:12 실행 실패 시)
  workflow_dispatch:
    inputs:
      stage:
        description: '수동 실행 단계 (pre_market / nxt / regular / scan)'
        required: true
        default: 'pre_market'

concurrency:
  # 2026-09-15: KIS 초당 20건 한도는 앱키 단위 — 다른 수집 워크플로와
  # 같은 그룹으로 묶어 동시 실행을 막는다(위 daily_collect.yml 주석 참고).
  group: kis-rest-batch
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 이후 단계를 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: steps.market_day.outputs.is_market_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.market_day.outputs.is_market_day == 'true'
        run: pip install psycopg2-binary requests

      - name: Determine stage
        id: stage
        if: steps.market_day.outputs.is_market_day == 'true'
        run: |
          # 수동 실행은 지정한 단계를 그대로, 스케줄 실행은 백업 모드로 돈다.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
            echo "guard=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "5 0 * * 1-5" ]; then
            echo "stage=pre_market" >> "$GITHUB_OUTPUT"
            echo "guard=--only-if-missing" >> "$GITHUB_OUTPUT"
          else
            echo "stage=regular" >> "$GITHUB_OUTPUT"
            echo "guard=--only-if-missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Get shared KIS token (NXT/REGULAR/SCAN 단계만 필요)
        id: kistoken
        if: steps.market_day.outputs.is_market_day == 'true' && steps.stage.outputs.stage != 'pre_market'
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_TOKEN_ISSUER: "gha:${{ github.workflow }}"
        run: |
          # 2026-09-15: 실행할 때마다 직접 발급하던 curl을 공유 캐시 방식으로 교체.
          # KIS는 접근토큰을 앱키당 1분 1회만 발급해 주는데, 워크플로 5개 + 릴레이
          # 서버가 각자 발급하다 보니 스케줄이 겹치는 순간 한쪽이 403 EGW00133으로
          # 막혔다. 토큰은 24시간 유효하므로 Supabase kis_token 테이블에 저장해
          # 모두가 나눠 쓴다(72_kis_token.py). 테이블이 없거나 DB가 막히면 예전처럼
          # 직접 발급으로 자동 폴백하므로 이 변경만으로 깨지지 않는다.
          TOKEN=$(python 72_kis_token.py)
          if [ -z "$TOKEN" ]; then
            echo "::error::KIS 토큰 획득 실패"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run candidate generation
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: python 66_intraday_candidates.py "${{ steps.stage.outputs.stage }}" ${{ steps.stage.outputs.guard }}

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="전략성과2 후보 생성 실패(${{ steps.stage.outputs.stage }})! GitHub Actions 로그를 확인하세요."
          echo "::error::$MSG"
          # 2026-09-12: ::error:: 주석은 GitHub Actions 로그를 직접 열어보지 않으면
          # 아무도 못 보므로, relay-server가 이미 쓰는 것과 같은 텔레그램 봇으로 실제
          # 알림을 보냅니다. 리포지토리 시크릿에 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID를
          # 등록해야 동작하고(둘 다 relay-server Render 환경변수와 같은 값 사용 가능),
          # 등록 전까지는 예전처럼 ::error:: 로그만 남습니다.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true
          fi
