name: Intraday Sangtta Candidates (전략성과2 후보)

# sangtta_virtual_trading_spec.md 1~3절의 3단계 후보 생성을 스케줄대로 실행합니다.
# intraday_candidates 테이블에 단계별(source)로 UPSERT됩니다.
#
# ⚠ KST → UTC 변환 (KST = UTC+9)
#   07:50 KST(장전)      = 전날 22:50 UTC → cron dow 0-4 (일~목)
#   08:40 KST(NXT 막판)  = 전날 23:40 UTC → cron dow 0-4 (일~목)
#   09:12 KST(정규장초반) = 당일 00:12 UTC → cron dow 1-5 (월~금)
#   09:00~15:55 KST(장중 연속 스캔, 5분 간격) = 당일 00:00~06:55 UTC → dow 1-5 (월~금)
#     (같은 UTC 날짜 구간이라 요일 이동 없음 — SCAN 단계 자체 내부에서도
#      09:15~15:20만 실제로 동작하도록 한 번 더 가드함, 크론 구간은 여유있게)
on:
  # 2026-09-11: 이 워크플로(PRE_MARKET/NXT/REGULAR/SCAN 3단계 후보 생성)는
  # relay-server/server.js의 candidateEngineHeartbeat()로 완전히 대체됨
  # (server.js 상단 "3-A2) 전략성과2(상따) 후보 발굴 엔진" 절 주석 참고,
  # 2026-09-09 전환). 그 사실을 모르고 이 스케줄이 계속 살아있어서 장중 5분
  # 간격으로 중복 실행되며 불필요한 Actions 사용량 + KIS 공유 토큰 요청을
  # 추가로 발생시키고(GitHub Actions 실패 로그의 EGW00133 "1분당 1회" 레이트
  # 리밋 충돌 원인 중 하나로 보임) 있었음이 확인되어 스케줄을 껐음.
  # relay-server가 내려가는 등 비상시엔 아래 workflow_dispatch로 수동 실행
  # 가능(예: stage=regular).
  # schedule:
  #   - cron: "50 22 * * 0-4"   # 07:50 KST — PRE_MARKET
  #   - cron: "40 23 * * 0-4"   # 08:40 KST — NXT
  #   - cron: "12 0 * * 1-5"    # 09:12 KST — REGULAR
  #   - cron: "*/5 0-6 * * 1-5" # 09:00~15:55 KST, 5분 간격 — SCAN
  workflow_dispatch:
    inputs:
      stage:
        description: '수동 실행 단계 (pre_market / nxt / regular / scan)'
        required: true
        default: 'pre_market'

concurrency:
  group: intraday-sangtta-candidates
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 이후 단계를 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: steps.market_day.outputs.is_market_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.market_day.outputs.is_market_day == 'true'
        run: pip install psycopg2-binary requests

      - name: Determine stage
        id: stage
        if: steps.market_day.outputs.is_market_day == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "50 22 * * 0-4" ]; then
            echo "stage=pre_market" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 23 * * 0-4" ]; then
            echo "stage=nxt" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "12 0 * * 1-5" ]; then
            echo "stage=regular" >> "$GITHUB_OUTPUT"
          else
            echo "stage=scan" >> "$GITHUB_OUTPUT"
          fi

      - name: Get shared KIS token (NXT/REGULAR/SCAN 단계만 필요)
        id: kistoken
        if: steps.market_day.outputs.is_market_day == 'true' && steps.stage.outputs.stage != 'pre_market'
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          # 2026-09-11: GitHub Actions 러너가 전 세계 무작위 리전에 배정되다 보니
          # 어쩌다 KIS 서버로의 네트워크 경로가 느린/막힌 리전에 걸리면 --max-time
          # 없는 curl이 2분 넘게 응답 없이 멈췄다가 exit 28로 실패하는 경우가 있어
          # (GitHub Actions 실패 로그 확인 결과) 타임아웃 + 짧은 재시도를 추가함.
          TOKEN=""
          for i in 1 2 3; do
            RESP=$(curl -s --connect-timeout 8 --max-time 20 -X POST "https://openapi.koreainvestment.com:9443/oauth2/tokenP" \
              -H "Content-Type: application/json" \
              -d "{\"grant_type\":\"client_credentials\",\"appkey\":\"$KIS_APP_KEY\",\"appsecret\":\"$KIS_APP_SECRET\"}")
            TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
            if [ -n "$TOKEN" ]; then
              break
            fi
            echo "KIS 토큰 발급 재시도 ($i/3) — 5초 후 재시도: $RESP"
            sleep 5
          done
          if [ -z "$TOKEN" ]; then
            echo "::error::KIS 토큰 발급 실패: $RESP"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run candidate generation
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: python 66_intraday_candidates.py "${{ steps.stage.outputs.stage }}"

      - name: Notify on failure
        if: failure()
        run: echo "::error::전략성과2 후보 생성 실패(${{ steps.stage.outputs.stage }})! GitHub Actions 로그를 확인하세요."
