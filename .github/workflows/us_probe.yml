name: US Stocks Probe (미국 종목 수집 가능성 점검, 읽기 전용)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary requests
      - name: Probe
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 93_us_probe.py --report us_probe_report.md
      - name: Publish report (branch us-probe-report)
        if: always()
        run: |
          [ -f us_probe_report.md ] || echo "리포트 없음 — 실패. Actions 로그 확인" > us_probe_report.md
          cp us_probe_report.md /tmp/us_probe_report.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan us-probe-report
          git rm -rq --cached . || true
          cp /tmp/us_probe_report.md us_probe_report.md
          git add -f us_probe_report.md
          git commit -qm "us probe ${{ github.run_id }}"
          git push -f origin us-probe-report
