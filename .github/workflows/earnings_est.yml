name: "[수집] 종목 예상실적(컨센서스) | 평일 20:10 KST | 네이버"
# 네이버 컨센서스(isConsensus=Y)만 갱신. 확정(is_est=false) 행은 건드리지 않습니다.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '테스트용 종목 수 제한(0=전체)'
        default: '0'
  schedule:
    - cron: '10 11 * * 1-5'   # 20:10 KST 평일(장 마감 후 다른 수집·계산 액션이 끝난 뒤)
permissions:
  contents: write
concurrency:
  group: earnings-est
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - name: Collect (est)
        run: python 125_earnings_collect.py est "${{ github.event.inputs.limit || '0' }}"
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: earnings-est-report
          file: earnings_est_report.md
