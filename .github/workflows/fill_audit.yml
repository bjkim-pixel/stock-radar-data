name: "[점검] 매수 체결 현황 점검 | 수동(읽기 전용)"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary
      - run: python 179_fill_audit.py | tee fill_audit.md
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: fill-report
          file: fill_audit.md
