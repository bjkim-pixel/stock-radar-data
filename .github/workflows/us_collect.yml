name: "[상시7] 해외(미국) 종목·ETF 일봉 수집 | 화~토 06:50 | KIS 해외"
# 글로벌 시황 미국 탭의 ETF·보유종목을 KIS 해외 API로 수집. 테이블은 스크립트가 직접 만듭니다(176_us_stocks.sql).
on:
  schedule:
    - cron: "50 21 * * 1-5"   # 화~토 06:50 KST — [상시3] 미국 탭 갱신(06:30) 뒤
    - cron: "50 22 * * 1-5"   # 지연 대비 보조(같은 값 덮어씀)
  workflow_dispatch:
    inputs:
      backfill:
        description: '2026-01-01까지 전체 백필 (true/false)'
        default: 'false'
concurrency:
  group: kis-rest-batch
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - name: Collect
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 176_us_collect.py ${{ inputs.backfill == 'true' && '--backfill' || '' }} 2>&1
