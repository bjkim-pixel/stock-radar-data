name: Setup Watchlist (관심·투자 종목 테이블 생성)

# 117_watchlist.sql 을 실행해 watchlist 테이블을 만듭니다(여러 번 실행해도 안전).
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - name: Create watchlist
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 117_watchlist_setup.py
