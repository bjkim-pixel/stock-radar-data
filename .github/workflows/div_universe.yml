name: "[수시] 고배당 후보 발굴·등록 | 우리 DB에 없는 국내 배당주 | dry=보고만, apply=등록+백필"
on:
  workflow_dispatch:
    inputs:
      step:
        description: "dry: 후보 보고만 / apply: 기준 이상 등록 + 시세 백필 + 업종 + 배당 수집"
        default: "dry"
        type: choice
        options: [dry, apply]
      div_min:
        description: "등록 기준 배당수익률(%)"
        default: "3"
      start_date:
        description: "백필 시작일"
        default: "20250901"
concurrency:
  group: kis-rest-batch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - name: 후보 발굴
        run: DIV_MIN="${{ inputs.div_min }}" python 240_div_universe.py ${{ inputs.step == 'apply' && '--apply' || '' }}
      - name: 시세 백필 (신규 종목만)
        if: inputs.step == 'apply'
        run: |
          if [ -s new_codes.txt ]; then
            CODES_FILE=new_codes.txt python 04_backfill.py "${{ inputs.start_date }}" "$(date +%Y%m%d)" 2>&1 | tail -n 40 > backfill_tail.txt
            { echo; echo "## 백필 로그(끝부분)"; echo '```'; cat backfill_tail.txt; echo '```'; } >> div_universe.md
          fi
      - name: 업종 갱신 + 배당 수집
        if: inputs.step == 'apply'
        run: |
          python 21_sector_kis_refresh.py 2>&1 | tail -n 8 || true
          python 157_map_sectors.py >> div_universe.md || true
          python 132_dividend_collect.py 2>&1 | tail -n 12
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: div-report
          file: div_universe.md
