name: "[수시] 아시아 종목 등록+백필 | 수동 | 목록 파일(asia_lists) 기준"
# asia_lists/<시장>.txt 의 종목을 us_top_asia 에 등록하고, KIS 해외 API로 조회해 us_master 등록 + 2026-01-01부터 일봉 백필.
on:
  workflow_dispatch:
    inputs:
      market:
        description: '시장 (jp=도쿄 / hk=홍콩 / cn=상해+심천)'
        default: 'jp'
permissions:
  contents: write
concurrency:
  group: kis-rest-batch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - run: python 200_asia_register.py ${{ inputs.market }}
      - run: python 176_us_collect.py --backfill --asia-only 2>&1 | tail -5
      - run: python 203_asia_names.py
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: asia-register-report
          file: us_collect_report.md
