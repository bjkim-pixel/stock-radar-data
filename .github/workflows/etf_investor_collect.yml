name: "[수집] ETF 투자자 수급·NAV 수동 실행 (30일 백필)"
on:
  workflow_dispatch:
concurrency:
  group: kis-rest-batch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - name: 수집
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 170_etf_investor_collect.py 2>&1 | tee etf_investor_report.md
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: etf-investor-report
          file: etf_investor_report.md
