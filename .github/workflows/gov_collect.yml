name: "[수집] 지배구조(이사회·최대주주·5%·소액주주·자기주식) | 평일 21:10 KST | DART"
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '테스트용 종목 수 제한(0=전체)'
        default: '0'
      fix_small:
        description: '소액주주 비율만 다시 채우기(true)'
        default: 'false'
  schedule:
    - cron: '10 12 * * 1-5'   # 21:10 KST 평일
permissions:
  contents: write
concurrency:
  group: gov-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - run: python 137_governance_collect.py "${{ github.event.inputs.limit || '0' }}" ${{ github.event.inputs.fix_small == 'true' && '--fix-small' || '' }}
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: gov-report
          file: gov_report.md
