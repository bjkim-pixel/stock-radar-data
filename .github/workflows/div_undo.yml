name: "[수시] 고배당 대량 등록 되돌리기 | 오늘 등록된 종목 삭제(요청 종목 제외)"
on:
  workflow_dispatch:
concurrency:
  group: div-undo
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary
      - run: python 244_div_undo.py
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: div-report
          file: div_undo.md
