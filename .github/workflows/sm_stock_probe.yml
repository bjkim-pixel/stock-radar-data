name: SM Stock Probe (종목 스마트머니 판정 근거, 읽기 전용)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "종목코드"
        default: "006400"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - name: Probe
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 97_sm_stock_probe.py ${{ inputs.code }}
      - name: Publish report (branch sm-stock-report)
        if: always()
        run: |
          [ -f sm_stock_report.md ] || echo "리포트 없음 — 실패" > sm_stock_report.md
          cp sm_stock_report.md /tmp/r.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan sm-stock-report
          git rm -rq --cached . || true
          cp /tmp/r.md sm_stock_report.md
          git add -f sm_stock_report.md
          git commit -qm "sm stock ${{ github.run_id }}"
          git push -f origin sm-stock-report
