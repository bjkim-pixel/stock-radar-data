name: "[점검] 거래 감사기록 점검 | 수동 | 읽기 전용"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary
      - run: python 164_audit_check.py > /dev/null 2>&1 || true
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: audit-check-report
          file: audit_check.md
