name: "[수시] 시가·고가·저가 0인 날 다시 채우기 | 수동"
on:
  workflow_dispatch:
    inputs:
      d1: {description: "시작일 YYYYMMDD", required: true}
      d2: {description: "끝일 YYYYMMDD", required: true}
permissions:
  contents: write
concurrency:
  group: kis-rest-batch
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - run: python 150_fill_ohl.py ${{ inputs.d1 }} ${{ inputs.d2 }} | tee fill_ohl_report.md
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: fill-ohl-report
          file: fill_ohl_report.md
