name: Setup ETF Views (종목후보용 ETF 뷰 생성)

# 108_etf_views.sql 실행 — v_etf_screener / v_etf_chart / v_etf_summary 생성(여러 번 실행해도 안전).
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - name: Create ETF views
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 108_etf_views_setup.py
