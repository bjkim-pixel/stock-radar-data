name: "[수집] 반도체 추종 외국인 보유율 | 평일 19:55 KST + 수동"

# 반도체 추종 2차(2026-11-25): 반도체 업종 종목의 외국인 보유율 일별. 수동 실행에서 backfill_from(예: 20250901)을 넣으면 네이버에서 그 날짜부터 채움
on:
  schedule:
    - cron: "55 10 * * 1-5"
  workflow_dispatch:
    inputs:
      days: {description: "최근 며칠 소급(기본 7)", default: "7"}
      backfill_from: {description: "과거 채우기 시작일 YYYYMMDD(비우면 최근 며칠만)", default: ""}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - name: 수집
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "${{ github.event.inputs.backfill_from }}" ]; then python 185_semi_hold.py backfill "${{ github.event.inputs.backfill_from }}"; else python 185_semi_hold.py "${{ github.event.inputs.days || '7' }}"; fi
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with: { branch: semi-hold-report, file: semi_hold_report.md }
