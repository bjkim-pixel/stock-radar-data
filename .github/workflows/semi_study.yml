name: "[점검] 반도체 추종 3단계 신호 검증 | 수동(읽기 전용)"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary pandas numpy
      - run: python 183_semi_regime_study.py
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: semi-study-report
          file: semi_regime_study.md
