name: Setup Access Log (접속 기록 테이블 생성)

# 92_access_log.sql 을 실행해 access_log 테이블을 만듭니다(여러 번 실행해도 안전).
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - name: Create access_log
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 92_access_log_setup.py
