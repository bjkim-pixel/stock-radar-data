name: Intraday KIS Collection (partial)

# 장중(08:00~20:00 KST, NXT 프리마켓+정규장+NXT 애프터마켓)에 30분 간격으로
# 그날 데이터를 미리 갱신합니다(2026-09-11: 09~20시 매시간 → 08~20시 30분
# 간격으로 확대, 사용자 요청). 16:05~20:05 KST 사이 30분 간격의 기존 일별
# 수집(daily_collect.yml)이 "확정 마감 데이터"를 채우는 반면, 이 워크플로는
# 아직 미확정인 장중 스냅샷을 is_partial=true로 적재합니다 — daily_collect.yml이
# 그날 최종적으로 실행되면 is_partial=false인 확정 값으로 덮어써집니다(둘 다
# (trade_date, code) UPSERT라 순서 걱정 없음).
#
# ⚠ 알아둘 점
#   - investor-trade-by-stock-daily(수급) 엔드포인트는 KIS 쪽에서 장중에는 전일자
#     확정 값만 내려줄 수 있습니다 — 장중 수급 숫자가 안 바뀌는 것처럼 보이면
#     이 API 특성 때문일 가능성이 큽니다(가격은 실시간에 가깝게 갱신됨).
#   - 종목 2,500여 개 × 시세/수급 2개 API를 30분마다 반복 호출하므로 하루 호출량이
#     기존(장마감 2회) 대비 약 12배로 늘어납니다(1시간 간격 대비로도 2배).
#     KIS 호출 한도/쿼터가 빠듯해지면 이 워크플로의 cron 간격을 늘리거나
#     비활성화하세요.
on:
  schedule:
    # 매 거래일 08:00·08:30 KST = 전날 23:00·23:30 UTC (dow 0-4 = 일~목 UTC → 월~금 KST)
    - cron: "0,30 23 * * 0-4"
    # 매 거래일 09:00~19:30 KST, 30분 간격 = 00:00~10:30 UTC (월~금)
    - cron: "0,30 0-10 * * 1-5"
    # 매 거래일 20:00 KST(NXT 애프터마켓 종료) = 11:00 UTC (월~금)
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

jobs:
  collect-partial:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 이후 단계를 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: steps.market_day.outputs.is_market_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.market_day.outputs.is_market_day == 'true'
        run: pip install psycopg2-binary requests

      - name: Get shared KIS token
        id: kistoken
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          # 2026-09-11: GitHub Actions 러너가 전 세계 무작위 리전에 배정되다 보니
          # 어쩌다 KIS 서버로의 네트워크 경로가 느린/막힌 리전에 걸리면 --max-time
          # 없는 curl이 2분 넘게 응답 없이 멈췄다가 exit 28로 실패하는 경우가 있어
          # (GitHub Actions 실패 로그 확인 결과) 타임아웃 + 짧은 재시도를 추가함.
          TOKEN=""
          for i in 1 2 3; do
            RESP=$(curl -s --connect-timeout 8 --max-time 20 -X POST "https://openapi.koreainvestment.com:9443/oauth2/tokenP" \
              -H "Content-Type: application/json" \
              -d "{\"grant_type\":\"client_credentials\",\"appkey\":\"$KIS_APP_KEY\",\"appsecret\":\"$KIS_APP_SECRET\"}")
            TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
            if [ -n "$TOKEN" ]; then
              break
            fi
            echo "KIS 토큰 발급 재시도 ($i/3) — 5초 후 재시도: $RESP"
            sleep 5
          done
          if [ -z "$TOKEN" ]; then
            echo "::error::KIS 토큰 발급 실패: $RESP"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run partial price/flow snapshot
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: python 03_daily_collect.py --partial

      - name: Run market index / program-trade snapshot
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: python 20_collect_market_extra.py

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="장중 부분 수집 실패! GitHub Actions 로그를 확인하세요."
          echo "::error::$MSG"
          # 2026-09-12: ::error:: 주석은 GitHub Actions 로그를 직접 열어보지 않으면
          # 아무도 못 보므로, relay-server가 이미 쓰는 것과 같은 텔레그램 봇으로 실제
          # 알림을 보냅니다. 리포지토리 시크릿에 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID를
          # 등록해야 동작하고(둘 다 relay-server Render 환경변수와 같은 값 사용 가능),
          # 등록 전까지는 예전처럼 ::error:: 로그만 남습니다.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true
          fi
