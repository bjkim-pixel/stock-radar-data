name: Intraday KIS Collection (partial)

# 장중(08:00~20:00 KST, NXT 프리마켓+정규장+NXT 애프터마켓)에 30분 간격으로
# 그날 데이터를 미리 갱신합니다(2026-09-11: 09~20시 매시간 → 08~20시 30분
# 간격으로 확대, 사용자 요청). 16:05~20:05 KST 사이 30분 간격의 기존 일별
# 수집(daily_collect.yml)이 "확정 마감 데이터"를 채우는 반면, 이 워크플로는
# 아직 미확정인 장중 스냅샷을 is_partial=true로 적재합니다 — daily_collect.yml이
# 그날 최종적으로 실행되면 is_partial=false인 확정 값으로 덮어써집니다(둘 다
# (trade_date, code) UPSERT라 순서 걱정 없음).
#
# ⚠ 알아둘 점
#   - investor-trade-by-stock-daily(수급) 엔드포인트는 KIS 쪽에서 장중에는 전일자
#     확정 값만 내려줄 수 있습니다 — 장중 수급 숫자가 안 바뀌는 것처럼 보이면
#     이 API 특성 때문일 가능성이 큽니다(가격은 실시간에 가깝게 갱신됨).
#   - 2026-09-15: 장중 스냅샷에서 **수급·프로그램매매 API 호출을 제거**했습니다.
#     위에 적힌 대로 KIS는 장중에 당일 수급 행을 안 내려주는 경우가 많고,
#     03_daily_collect.py는 TARGET_DATE와 일치하는 행만 채택하므로 받아온 응답을
#     그대로 버리고 있었습니다(= 순수 낭비). 확정 수급은 16:05~20:05 KST의
#     daily_collect.yml이 채웁니다.
#     효과: 종목당 3건 → 1건, 하루 약 17만 건 → 약 5.8만 건.
#     장중 수급이 실제로 필요하다고 확인되면 아래 스텝 env에 PARTIAL_WITH_FLOW=1을
#     넣어 예전 동작으로 되돌릴 수 있습니다.
on:
  # 2026-09-18: 스케줄 실행 정지 — 사용자가 정규장 마감(16:00 KST) 이후에만
  # 시장 상황을 확인해서, 장중(08:00~20:00) 30분 간격 잠정치 스냅샷이 필요
  # 없다고 판단. 이 워크플로가 확정치 계산(daily_collect.yml/compute.yml,
  # TREND·CLOSEBET·CLOSEBET2 판정)에 쓰이는 값을 만드는 건 아니라서(잠정치는
  # daily_collect.yml이 그대로 덮어씀 — 위 주석 참고) 꺼도 결과 자체엔 영향
  # 없음. 하루 25회 예약 실행을 없애 GitHub Actions 스케줄 큐 부담을 줄이는
  # 목적(전략성과 결과가 18시가 아니라 20시 넘어 나오는 지연 문제 대응).
  # 필요해지면 아래 schedule: 블록 주석을 풀거나, 수동 실행(workflow_dispatch)
  # 은 그대로 가능.
  # schedule:
  #   # 매 거래일 08:00·08:30 KST = 전날 23:00·23:30 UTC (dow 0-4 = 일~목 UTC → 월~금 KST)
  #   - cron: "0,30 23 * * 0-4"
  #   # 매 거래일 09:00~19:30 KST, 30분 간격 = 00:00~10:30 UTC (월~금)
  #   - cron: "0,30 0-10 * * 1-5"
  #   # 매 거래일 20:00 KST(NXT 애프터마켓 종료) = 11:00 UTC (월~금)
  #   - cron: "0 11 * * 1-5"
  workflow_dispatch:

concurrency:
  # 2026-09-15: KIS REST는 "초당 20건"이 앱키 단위 한도라서, 종목 전체를 도는
  # 수집 워크플로가 둘 이상 동시에 돌면 각자 한도 안이어도 합산에서 초과한다
  # (실제로 daily_collect :05/:35 와 intraday_collect :00/:30 는 각 실행이
  # 7~10분 걸려 매 30분마다 2분가량 겹쳤다). 같은 group을 쓰면 GitHub이
  # 뒤에 온 실행을 앞 실행이 끝날 때까지 대기시켜 겹침 자체가 사라진다.
  # cancel-in-progress: false — 진행 중인 수집을 죽이지 않고 줄을 세운다.
  group: kis-rest-batch
  cancel-in-progress: false

jobs:
  collect-partial:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 이후 단계를 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: steps.market_day.outputs.is_market_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.market_day.outputs.is_market_day == 'true'
        run: pip install psycopg2-binary requests

      - name: Get shared KIS token
        id: kistoken
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_TOKEN_ISSUER: "gha:${{ github.workflow }}"
        run: |
          # 2026-09-15: 실행할 때마다 직접 발급하던 curl을 공유 캐시 방식으로 교체.
          # KIS는 접근토큰을 앱키당 1분 1회만 발급해 주는데, 워크플로 5개 + 릴레이
          # 서버가 각자 발급하다 보니 스케줄이 겹치는 순간 한쪽이 403 EGW00133으로
          # 막혔다. 토큰은 24시간 유효하므로 Supabase kis_token 테이블에 저장해
          # 모두가 나눠 쓴다(72_kis_token.py). 테이블이 없거나 DB가 막히면 예전처럼
          # 직접 발급으로 자동 폴백하므로 이 변경만으로 깨지지 않는다.
          TOKEN=$(python 72_kis_token.py)
          if [ -z "$TOKEN" ]; then
            echo "::error::KIS 토큰 획득 실패"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run partial price snapshot (시세만 — 수급은 확정 수집이 담당)
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: python 03_daily_collect.py --partial

      - name: Run market index / program-trade snapshot
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: python 20_collect_market_extra.py

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="장중 부분 수집 실패! GitHub Actions 로그를 확인하세요."
          echo "::error::$MSG"
          # 2026-09-12: ::error:: 주석은 GitHub Actions 로그를 직접 열어보지 않으면
          # 아무도 못 보므로, relay-server가 이미 쓰는 것과 같은 텔레그램 봇으로 실제
          # 알림을 보냅니다. 리포지토리 시크릿에 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID를
          # 등록해야 동작하고(둘 다 relay-server Render 환경변수와 같은 값 사용 가능),
          # 등록 전까지는 예전처럼 ::error:: 로그만 남습니다.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true
          fi
