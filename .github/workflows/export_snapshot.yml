name: Export Snapshot

# 화면 첫 로딩을 빠르게 하려는 정적 스냅샷(JSON 한 파일)을 만들어 data-snapshot 브랜치에 올립니다(매번 덮어쓰기 — 이력이 쌓이지 않음).
# 종목후보·오늘의 종목·수급동향이 쓰는 큰 뷰(v_screener 등)를 화면을 열 때마다 DB가 새로 계산하지 않게 하는 용도입니다.
# 지표 계산 뒤 flow_cap_ratio·sector_flow_daily 갱신이 끝나면 실행(둘 다 끝난 뒤 마지막 실행이 최종본).
on:
  workflow_run:
    workflows: ["Flow/MarketCap Ratio", "Sector Flow Daily"]
    types: [completed]
  workflow_dispatch:
  # push 트리거 제거(2026-10-25): 코드를 올릴 때마다 자동으로 돌지 않고, 예약·연결·수동 실행(Run workflow)만 씁니다.

concurrency:
  group: export-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - name: Build snapshot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 88_export_snapshot.py --out snapshot.json --report snapshot_report.md
      - name: Publish (branch data-snapshot)
        run: |
          [ -s snapshot.json ] || { echo "snapshot.json 없음 — 게시 건너뜀"; exit 1; }
          cp snapshot.json /tmp/snapshot.json; cp snapshot_report.md /tmp/snapshot_report.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan data-snapshot
          git rm -rq --cached . || true
          cp /tmp/snapshot.json snapshot.json; cp /tmp/snapshot_report.md snapshot_report.md
          git add -f snapshot.json snapshot_report.md
          git commit -qm "snapshot ${{ github.run_id }}"
          git push -f origin data-snapshot
