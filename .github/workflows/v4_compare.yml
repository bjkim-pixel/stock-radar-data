name: V4 Backtest Compare (dry-run)

on:
  workflow_dispatch:
    inputs:
      sim_from:
        description: '시뮬레이션 시작일 (YYYYMMDD). 백테스트 검증구간은 20260401'
        required: false
        default: '20260401'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - name: Compare
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python 06_portfolio.py --sim-from="${{ github.event.inputs.sim_from }}" --dry-run
