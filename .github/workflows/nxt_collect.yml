name: NXT After-market Collection

# 2026-09-11 신설 — "종가베팅2" 전략(정규장 등락률 vs NXT 등락률 괴리 top10 →
# 시가총액 상위 3개)이 쓰는 daily_price.nxt_close/nxt_change_pct를 채웁니다.
#
# 2026-09-18: 종가베팅2 기준가를 NXT 20시 확정 마감가 → NXT 18시 스냅샷으로 변경.
# 이유: 20시 확정가 기준이면 결과가 20:10경에야 나와 사용자가 NXT 장중(~20:00)
# 실제 매수에 쓸 수 없었음. 18시 스냅샷 기준이면 18:12 수집 → 18:15 compute 실행
# → 18시 결과 확정, 사용자가 18:15~19:59에 실제 매수 판단 가능.
#
# 이 워크플로는 두 가지 용도로 씁니다.
#   ① 18:12 KST 첫 실행 (--snapshot 플래그) — nxt_price_1800/nxt_change_pct_1800
#      컬럼에 그날 최초 1회만 저장(이후 재실행에서 절대 덮어쓰지 않음). 동시에
#      nxt_close/nxt_change_pct도 같은 값으로 채움. compute.yml이 이 직후
#      18:15 KST에 실행돼 종가베팅2 결과를 확정합니다.
#   ② 18:42~20:20 KST 후속 실행 — nxt_close/nxt_change_pct만 갱신(최신 장중가
#      또는 20:20 KST 확정가로 계속 덮어씀). 18시 스냅샷 컬럼은 건드리지 않음.
#      나머지 장중 수집(18:42~20:02)은 화면 참고용, 20:20은 공식 마감가 기록용.
#
# ⚠ 사전 준비: 69_nxt_price_columns.sql 그리고 71_nxt_1800_columns.sql을
#   Supabase SQL Editor에서 먼저 실행해야 합니다.
on:
  schedule:
    # ── ① 장중 실시간 확인용 (18:00~19:50 KST, 월~금) ──────────────────────
    # 2026-09-15: :00/:30 → :12/:42 로 이동. KIS 접근토큰은 "앱키당 1분 1회"라
    # intraday_collect.yml(:00/:30)과 같은 분에 시작하면 한쪽 토큰 발급이
    # 403 EGW00133으로 막힌다(하루 4회 충돌: 09:00·09:30·10:00·10:30 UTC).
    # 12분 어긋나게 두면 GitHub 스케줄 지연이 얹혀도 같은 분에 겹치기 어렵다.
    - cron: "12 9 * * 1-5"   # 18:12 KST = 09:12 UTC
    - cron: "42 9 * * 1-5"   # 18:42 KST = 09:42 UTC
    - cron: "12 10 * * 1-5"  # 19:12 KST = 10:12 UTC
    - cron: "42 10 * * 1-5"  # 19:42 KST = 10:42 UTC (여기부터 20분 간격)
    - cron: "2 11 * * 1-5"   # 20:02 KST = 11:02 UTC (NXT 마감 2분 전 마지막 장중 확인)
    # ── ② 공식 마감가 확정용 (20:20 KST, 월~금) ─────────────────────────────
    - cron: "20 11 * * 1-5"  # 20:20 KST = 11:20 UTC
    #   (2026-09-15: 20:10 → 20:20. daily_collect의 마지막 실행 20:05 KST 와
    #    5분밖에 안 떨어져 있어 GitHub 스케줄 지연이 조금만 얹혀도 토큰 발급이
    #    같은 분에 겹쳤다. 또 두 워크플로가 같은 concurrency group이라 앞 실행이
    #    아직 도는 중이면 어차피 대기하므로 여유를 더 둔다.)
  workflow_dispatch:
    inputs:
      target_date:
        description: '수집 날짜 (YYYYMMDD, 비우면 오늘)'
        required: false
        default: ''
      debug_code:
        description: '(디버그) 이 종목코드만 조회해 API 원본 응답을 Summary에 출력 (공백으로 여러 개, 비우면 일반 수집)'
        required: false
        default: ''

concurrency:
  # 2026-09-15: KIS REST는 "초당 20건"이 앱키 단위 한도라서, 종목 전체를 도는
  # 수집 워크플로가 둘 이상 동시에 돌면 각자 한도 안이어도 합산에서 초과한다
  # (실제로 daily_collect :05/:35 와 intraday_collect :00/:30 는 각 실행이
  # 7~10분 걸려 매 30분마다 2분가량 겹쳤다). 같은 group을 쓰면 GitHub이
  # 뒤에 온 실행을 앞 실행이 끝날 때까지 대기시켜 겹침 자체가 사라진다.
  # cancel-in-progress: false — 진행 중인 수집을 죽이지 않고 줄을 세운다.
  group: kis-rest-batch
  cancel-in-progress: false

jobs:
  collect-nxt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 거래일 확인 (공휴일 스킵)
        id: market_day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOLIDAYS="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-01 2026-05-05 2026-05-25 2026-06-03 2026-07-17 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          if echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "is_market_day=false" >> "$GITHUB_OUTPUT"
            echo "⏸️ $TODAY 은 KRX 휴장일 — 이후 단계를 건너뜁니다"
          else
            echo "is_market_day=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: steps.market_day.outputs.is_market_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.market_day.outputs.is_market_day == 'true'
        run: pip install psycopg2-binary requests

      - name: Get shared KIS token
        id: kistoken
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_TOKEN_ISSUER: "gha:${{ github.workflow }}"
        run: |
          # 2026-09-15: 실행할 때마다 직접 발급하던 curl을 공유 캐시 방식으로 교체.
          # KIS는 접근토큰을 앱키당 1분 1회만 발급해 주는데, 워크플로 5개 + 릴레이
          # 서버가 각자 발급하다 보니 스케줄이 겹치는 순간 한쪽이 403 EGW00133으로
          # 막혔다. 토큰은 24시간 유효하므로 Supabase kis_token 테이블에 저장해
          # 모두가 나눠 쓴다(72_kis_token.py). 테이블이 없거나 DB가 막히면 예전처럼
          # 직접 발급으로 자동 폴백하므로 이 변경만으로 깨지지 않는다.
          TOKEN=$(python 72_kis_token.py)
          if [ -z "$TOKEN" ]; then
            echo "::error::KIS 토큰 획득 실패"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run NXT collection
        if: steps.market_day.outputs.is_market_day == 'true'
        env:
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          KIS_ACCESS_TOKEN: ${{ steps.kistoken.outputs.token }}
        run: |
          DATE="${{ github.event.inputs.target_date }}"
          CODE="${{ github.event.inputs.debug_code }}"

          # 2026-09-18: 18:12 KST 실행(cron "12 9 * * 1-5")에서만 --snapshot 플래그를
          # 전달해 nxt_price_1800/nxt_change_pct_1800에 최초 1회 저장을 수행합니다.
          # 이후 실행(18:42 이후)은 플래그 없이 nxt_close만 갱신합니다.
          # GitHub Actions는 정확한 실행 시각을 환경변수로 주지 않으므로, UTC 분(MM)으로
          # 18:12 KST(= 09:12 UTC)를 탐지합니다. 지연이 얹혀 09:19분까지 실행되더라도
          # --snapshot이 적용되도록 09:09~09:19 UTC(=18:09~18:19 KST) 범위로 잡습니다.
          SNAPSHOT_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            UTC_H=$(date -u +%H)
            UTC_M=$(date -u +%M)
            if [ "$UTC_H" = "09" ] && [ "$UTC_M" -ge 9 ] && [ "$UTC_M" -le 19 ]; then
              SNAPSHOT_FLAG="--snapshot"
              echo "📸 18:12 KST 실행 감지 → --snapshot 모드 활성화"
            fi
          fi

          if [ -n "$CODE" ]; then
            echo "### 🔍 NXT API 디버그: $CODE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python 70_nxt_collect.py --debug $CODE 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$DATE" ]; then
            python 70_nxt_collect.py $SNAPSHOT_FLAG
          else
            python 70_nxt_collect.py "$DATE" $SNAPSHOT_FLAG
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="NXT 마감 시세 수집 실패! 69_nxt_price_columns.sql을 실행했는지 먼저 확인하고, GitHub Actions 로그를 확인하세요."
          echo "::error::$MSG"
          # 2026-09-12: ::error:: 주석은 GitHub Actions 로그를 직접 열어보지 않으면
          # 아무도 못 보므로, relay-server가 이미 쓰는 것과 같은 텔레그램 봇으로 실제
          # 알림을 보냅니다. 리포지토리 시크릿에 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID를
          # 등록해야 동작하고(둘 다 relay-server Render 환경변수와 같은 값 사용 가능),
          # 등록 전까지는 예전처럼 ::error:: 로그만 남습니다.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true
          fi
