name: "[수집] 반도체 추종 공매도·신용·시장 투자자(KIS) | 평일 19:50 KST + 수동"

# 반도체 추종 2단계(2026-11-25): 반도체 업종 종목의 공매도 일별·신용잔고 일별 + 코스피·코스닥 투자자별(연기금 포함)
#  · 수동 실행에서 backfill_from(예: 20250901)을 넣으면 그 날짜부터 오늘까지 채움(종목 수가 많아 20~30분 걸릴 수 있음)
on:
  schedule:
    - cron: "50 10 * * 1-5"
  workflow_dispatch:
    inputs:
      days: {description: "최근 며칠 소급(기본 7)", default: "7"}
      backfill_from: {description: "과거 채우기 시작일 YYYYMMDD(비우면 최근 며칠만)", default: ""}
concurrency:
  group: kis-rest-batch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - name: 수집
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "${{ github.event.inputs.backfill_from }}" ]; then python 182_semi_short.py backfill "${{ github.event.inputs.backfill_from }}"; else python 182_semi_short.py "${{ github.event.inputs.days || '7' }}"; fi
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with: { branch: semi-short-report, file: semi_short_report.md }
