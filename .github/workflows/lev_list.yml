name: "[점검] 레버리지·인버스 ETF 목록 | 수동 | 읽기 전용"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python 166_lev_list.py 2>&1 | tail -5
      - name: Publish report
        if: always()
        uses: ./.github/actions/publish-report
        with:
          branch: lev-list-report
          file: lev_list.md
