name: "[점검] 실적·예상실적 소스 확인 | 수동 | 읽기 전용"
on:
  workflow_dispatch:
    inputs:
      code:
        description: '종목 코드'
        default: '000660'
concurrency:
  group: kis-rest-batch
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install psycopg2-binary requests
      - name: Probe KIS
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python 123_kis_fin_probe.py "${{ github.event.inputs.code }}" 2>&1
      - name: Probe consensus sources
        run: python 124_consensus_probe.py "${{ github.event.inputs.code }}" 2>&1
