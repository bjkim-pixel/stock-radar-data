name: Set Stock Sectors (업종 일괄 지정)

# 미분류 종목(예: Add Single Stock으로 새로 넣은 종목)에 업종을 한 번에 지정합니다 — sector_override 테이블에 저장(89_set_sectors.py).
# 사용법:
#   1) entries를 비운 채 실행(목록 모드) → 로그/요약에 '지금 미분류인 종목'과 '쓸 수 있는 업종 이름'이 나옵니다.
#   2) entries에 "종목=업종; 종목=업종" 형식으로 입력하고 dry_run=true로 실행 → 검증 결과만 확인(저장 안 함).
#   3) 문제가 없으면 같은 입력으로 dry_run=false로 실행 → 저장.
on:
  workflow_dispatch:
    inputs:
      entries:
        description: '종목=업종; 종목=업종 … (종목은 이름 또는 6자리 코드, 예: 엑시콘=반도체; 지투지바이오=제약). 비우면 미분류 목록만 표시'
        required: false
        default: ''
      lookup:
        description: '(선택) 업종 값을 점검할 종목 이름들 — 예: 엑시콘, 지투지바이오. 비우면 최근 추가 종목 20개만 점검'
        required: false
        default: ''
      dry_run:
        description: '미리보기만(저장 안 함) — 확인 후 false로 다시 실행하면 저장'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions: write

jobs:
  set-sectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - name: Set sectors
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ENTRIES: ${{ inputs.entries }}
          DRY_RUN: ${{ inputs.dry_run }}
          LOOKUP: ${{ inputs.lookup }}
        run: python 89_set_sectors.py --report sector_report.md
      - name: Publish report (branch sector-report)
        if: always()
        run: |
          [ -f sector_report.md ] || echo "리포트 없음 — 실패. Actions 로그 확인" > sector_report.md
          cp sector_report.md /tmp/sector_report.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan sector-report
          git rm -rq --cached . || true
          cp /tmp/sector_report.md sector_report.md
          git add -f sector_report.md
          git commit -qm "sector report ${{ github.run_id }}"
          git push -f origin sector-report
      - name: Refresh snapshot (저장했을 때만)
        if: ${{ inputs.dry_run == false && inputs.entries != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run export_snapshot.yml --ref main || true
