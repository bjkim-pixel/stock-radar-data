<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>거래 PIN 해시 만들기</title>
<style>
body{font-family:system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;margin:0;padding:16px;background:#f9f9f7;color:#0b0b0b}
main{max-width:420px;margin:24px auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:17px;margin:0}p,li{font-size:13px;line-height:1.55;color:#52514e;margin:0}
input,button,textarea{font:inherit;font-size:16px;min-height:44px;border-radius:8px;border:1px solid #c3c2b7;padding:0 10px;box-sizing:border-box;width:100%}
button{background:#0b0b0b;color:#f9f9f7;border:none;cursor:pointer}textarea{min-height:92px;padding:8px;font-size:12px;word-break:break-all;background:#fff}
#err{color:#d03b3b;font-size:12px;min-height:16px}
</style></head><body><main>
<h1>거래 PIN 해시 만들기</h1>
<p>PIN을 이 기기 안에서만 계산해 <b>해시값</b>으로 바꿉니다. PIN은 어디로도 전송·저장되지 않습니다(이 페이지는 외부 요청을 하지 않습니다).</p>
<input id="p1" type="password" inputmode="numeric" autocomplete="new-password" placeholder="PIN (숫자 6자리 이상)">
<input id="p2" type="password" inputmode="numeric" autocomplete="new-password" placeholder="PIN 다시 입력">
<button id="go" type="button">해시 만들기</button>
<div id="err" role="alert"></div>
<textarea id="out" readonly placeholder="여기에 결과가 나옵니다"></textarea>
<button id="cp" type="button" style="background:#fff;color:#0b0b0b;border:1px solid #c3c2b7">복사</button>
<ol><li>Render › kis-relay-server › Environment 에 <code>TRADE_PIN_HASH</code> 로 위 값을 붙여넣고 저장합니다.</li>
<li>PIN은 따로 안전하게 기억해 두세요. 잊으면 이 페이지에서 새로 만들어 교체합니다.</li></ol>
</main>
<script>
const $=id=>document.getElementById(id), b64=u=>btoa(String.fromCharCode(...u));
$("go").onclick=async()=>{
  const a=$("p1").value,b=$("p2").value,e=$("err");e.textContent="";$("out").value="";
  if(a.length<6){e.textContent="PIN은 6자 이상이어야 합니다.";return;}
  if(a!==b){e.textContent="두 입력이 다릅니다.";return;}
  if(/^(\d)\1+$/.test(a)||"0123456789012345".includes(a)||"9876543210987654".includes(a)){e.textContent="너무 쉬운 PIN입니다(같은 숫자 반복·연속 숫자 제외).";return;}
  const iter=210000,salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(a),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},key,256));
  $("out").value=`pbkdf2$${iter}$${b64(salt)}$${b64(bits)}`;$("p1").value=$("p2").value="";
};
$("cp").onclick=async()=>{const t=$("out").value;if(!t)return;try{await navigator.clipboard.writeText(t);$("cp").textContent="복사됨";}catch(_){$("out").select();}};
</script></body></html>
