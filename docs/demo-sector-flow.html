<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데모: 업종별 자금흐름</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#fff; --line:#eceef0; --txt:#111; --dim:#8a8f98;
    --up:#d64545; --down:#2f6fd6;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1012; --card:#1a1b1e; --line:#2a2c30; --txt:#eee; --dim:#8a8f98;
      --up:#ff6b6b; --down:#5b9bff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1012; --card:#1a1b1e; --line:#2a2c30; --txt:#eee; --dim:#8a8f98;
    --up:#ff6b6b; --down:#5b9bff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;
    font-size:14px;}
  .wrap{max-width:720px;margin:0 auto;padding:12px 12px 32px}
  h1{font-size:16px;margin:4px 0 2px}
  .note{color:var(--dim);font-size:12px;margin:0 0 14px}
  .badge{display:inline-block;background:#ffefc2;color:#8a6500;font-size:11px;
    padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
  :root[data-theme="dark"] .badge,
  @media (prefers-color-scheme: dark){ .badge{background:#473c15;color:#ffd880} }

  .daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;
    -webkit-overflow-scrolling:touch}
  .daytab{flex:0 0 auto;padding:8px 14px;border-radius:10px;background:var(--card);
    border:1px solid var(--line);font-size:13px;color:var(--dim);white-space:nowrap}
  .daytab.active{background:#1e40af;color:#fff;border-color:#1e40af;font-weight:600}

  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
  .tile .lb{font-size:11px;color:var(--dim);margin-bottom:4px}
  .tile .vl{font-size:15px;font-weight:700}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 6px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;padding-left:12px}
  th{color:var(--dim);font-weight:600;font-size:11px;border-bottom:1px solid var(--line)}
  tbody tr:not(:last-child) td{border-bottom:1px solid var(--line)}
  .up{color:var(--up)}
  .down{color:var(--down)}
  .bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:4px}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div class="wrap">
  <h1>업종별 자금흐름 (데모)<span class="badge">샘플 데이터</span></h1>
  <p class="note">최근 5거래일 · 업종별 거래대금 상위 15개 · 수급주체별 순매수(억원) · 실제 수치 아님, 레이아웃 확인용</p>

  <div class="daytabs" id="dayTabs"></div>

  <div class="summary" id="summaryTiles"></div>

  <div class="card scrollx">
    <table>
      <thead><tr>
        <th>업종</th><th>거래대금</th><th>외국인</th><th>기관</th><th>개인</th><th>합계(쏠림)</th>
      </tr></thead>
      <tbody id="flowBody"></tbody>
    </table>
  </div>

  <p class="note" style="margin-top:14px">
    레이아웃/표시 항목이 의도와 맞는지 확인 부탁드립니다 — 맞으면 실제 데이터(v_sector_flow_daily 등)로 연결해서 수급동향 페이지에 반영하겠습니다.
  </p>
</div>

<script>
// ── 샘플 데이터 (실제 DB 조회 아님) ──────────────────────────────────────
const SECTORS = ["전기·전자","기계·장비","화학","제약","일반서비스","금속","운수장비·부품",
  "유통","건설·건축관련","음식료·담배","섬유·의류","종이·목재","철강금속","기타제조","통신방송서비스"];

function seedRandom(seed){
  let s = seed;
  return () => { s = (s*9301+49297) % 233280; return s/233280; };
}

function makeDay(dateLabel, seed){
  const rnd = seedRandom(seed);
  const rows = SECTORS.map(name=>{
    const amt = Math.round(3000 + rnd()*25000);                 // 거래대금(억)
    const foreign = Math.round((rnd()-0.45)*amt*0.25);
    const inst    = Math.round((rnd()-0.45)*amt*0.22);
    const indiv   = -Math.round((foreign+inst)*(0.7+rnd()*0.5)); // 대략 외국인+기관 반대 방향
    const total = foreign+inst+indiv;
    return {name, amt, foreign, inst, indiv, total};
  }).sort((a,b)=>Math.abs(b.total)-Math.abs(a.total)).slice(0,15)
    .sort((a,b)=>b.total-a.total);
  return {date:dateLabel, rows};
}

const DAYS = [
  makeDay("10/02(목)", 11),
  makeDay("10/05(일)".replace("일","월"), 22),
  makeDay("10/06(화)", 33),
  makeDay("10/07(수)", 44),
  makeDay("10/08(목)", 55),
];

const N = v => Math.abs(v).toLocaleString("ko-KR");
const pm = v => (v>0?"+":v<0?"-":"") + N(v);
const sgn = v => v>0?"up":v<0?"down":"";

let curIdx = DAYS.length-1;

function renderTabs(){
  document.getElementById("dayTabs").innerHTML = DAYS.map((d,i)=>
    `<button class="daytab ${i===curIdx?"active":""}" data-i="${i}">${d.date}</button>`
  ).join("");
  document.querySelectorAll(".daytab").forEach(b=>{
    b.onclick = ()=>{ curIdx = +b.dataset.i; renderAll(); };
  });
}

function renderSummary(){
  const rows = DAYS[curIdx].rows;
  const sum = key => rows.reduce((a,r)=>a+r[key],0);
  const f = sum("foreign"), i = sum("inst"), p = sum("indiv");
  const tiles = [["외국인 합계",f],["기관 합계",i],["개인 합계",p]];
  document.getElementById("summaryTiles").innerHTML = tiles.map(([lb,v])=>
    `<div class="tile"><div class="lb">${lb}</div><div class="vl ${sgn(v)}">${pm(v)}억</div></div>`
  ).join("");
}

function renderTable(){
  const rows = DAYS[curIdx].rows;
  const maxAmt = Math.max(...rows.map(r=>r.amt));
  document.getElementById("flowBody").innerHTML = rows.map(r=>`
    <tr>
      <td>${r.name}</td>
      <td><span class="bar" style="width:${Math.round(r.amt/maxAmt*28)}px;background:var(--dim);opacity:.35"></span>${N(r.amt)}</td>
      <td class="${sgn(r.foreign)}">${pm(r.foreign)}</td>
      <td class="${sgn(r.inst)}">${pm(r.inst)}</td>
      <td class="${sgn(r.indiv)}">${pm(r.indiv)}</td>
      <td class="${sgn(r.total)}" style="font-weight:700">${pm(r.total)}</td>
    </tr>`).join("");
}

function renderAll(){ renderTabs(); renderSummary(); renderTable(); }
renderAll();
</script>
</body>
</html>
