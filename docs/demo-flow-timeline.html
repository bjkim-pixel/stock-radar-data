<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>목업: 외국인 자금 이동 타임라인</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#fff; --line:#eceef0; --txt:#111; --dim:#8a8f98;
    --up:#d64545; --down:#2f6fd6; --accent:#1e40af;
    --upRGB:214,69,69; --downRGB:47,111,214;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1012; --card:#1a1b1e; --line:#2a2c30; --txt:#eee; --dim:#9aa0a8;
      --up:#ff6b6b; --down:#5b9bff; --accent:#7ea2ff; --upRGB:255,107,107; --downRGB:91,155,255;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;font-size:13px}
  .wrap{max-width:720px;margin:0 auto;padding:12px 10px 32px}
  h1{font-size:16px;margin:4px 0 2px}
  .note{color:var(--dim);font-size:12px;margin:0 0 10px;line-height:1.5}
  .badge{display:inline-block;background:#ffefc2;color:#8a6500;font-size:11px;padding:2px 7px;
    border-radius:999px;margin-left:6px;vertical-align:1px}
  @media (prefers-color-scheme: dark){ .badge{background:#473c15;color:#ffd880} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px 12px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--dim);margin:0 2px 8px}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .lg-buy{width:18px;height:0;border-top:3px solid var(--up);display:inline-block}
  .lg-sell{width:18px;height:0;border-top:3px dashed var(--down);display:inline-block}
  .lg-box{width:12px;height:12px;border-radius:3px;display:inline-block}
  .chart{position:relative}
  .grid{display:grid;grid-template-columns:78px repeat(5,1fr);gap:3px}
  .hd{font-size:11px;text-align:center;color:var(--dim);padding:2px 0 4px;line-height:1.3}
  .hd b{display:block;color:var(--txt);font-size:12px}
  .hd .tot{font-size:10.5px}
  .rl{display:flex;flex-direction:column;justify-content:center;font-size:12px;font-weight:600;
    padding-right:4px;min-height:42px}
  .rl small{font-size:10px;color:var(--dim);font-weight:400}
  .cell{min-height:42px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;position:relative}
  svg.paths{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .mark{position:absolute;top:2px;right:3px;font-size:9px;font-weight:700;color:#fff;
    border-radius:3px;padding:0 3px;line-height:14px}
  .mark.b{background:var(--up)} .mark.s{background:var(--down)}
</style>
</head>
<body>
<div class="wrap">
  <h1>외국인 자금 이동 타임라인<span class="badge">샘플 데이터</span></h1>
  <p class="note">최근 5거래일 · 거래대금 상위 10개 업종 · 칸 = 외국인 순매수(억원) · 실제 수치 아님, 구성 확인용</p>
  <div class="card">
    <div class="legend">
      <span><i class="lg-box" style="background:rgba(var(--upRGB),.45)"></i>순매수</span>
      <span><i class="lg-box" style="background:rgba(var(--downRGB),.45)"></i>순매도</span>
      <span><i class="lg-buy"></i>그날 순매수 1위 업종 이동</span>
      <span><i class="lg-sell"></i>그날 순매도 1위 업종 이동</span>
    </div>
    <div class="chart" id="chart"></div>
  </div>
  <p class="note" style="margin-top:10px">
    칸이 진할수록 금액이 큽니다. 굵은 빨간 선을 따라가면 외국인 순매수가 가장 컸던 업종이 날마다 어디로 옮겨갔는지,
    파란 점선은 가장 많이 팔아낸 업종이 어디로 옮겨갔는지 보입니다. 이 구성이 맞는지 확인 부탁드립니다.
  </p>
</div>
<script>
// ── 샘플 데이터(실제 DB 조회 아님) ────────────────────────────────────────
const SECTORS=["전기·전자","화학","제약","기계·장비","운수장비","금융업","금속","유통업","건설업","일반서비스"];
const DATES=[["10/08","수"],["10/10","금"],["10/13","월"],["10/14","화"],["10/15","수"]];
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
const R=rnd(7);
const amt=SECTORS.map((_,i)=>Math.round(52000-i*4100+R()*3000));
const base=SECTORS.map(()=>(R()-0.5)*600);
const V=SECTORS.map((_,i)=>DATES.map((_,d)=>{
  let v=base[i]*0.35+(R()-0.5)*1300;
  if(i===0&&d<=1)v+=1800; if(i===2&&d>=1&&d<=3)v+=1500; if(i===3&&d>=3)v+=1900;
  if(i===1&&d===0)v-=1700; if(i===5&&d>=1&&d<=2)v-=1600; if(i===4&&d>=3)v-=1400;
  return Math.round(v);
}));
const N=v=>Math.abs(Math.round(v)).toLocaleString("ko-KR");
const pm=v=>(v>0?"+":v<0?"-":"")+N(v);
const maxAbs=Math.max(...V.flat().map(Math.abs));
function build(){
  const chart=document.getElementById("chart");
  const topBuy=DATES.map((_,d)=>V.map((r,i)=>[r[d],i]).sort((a,b)=>b[0]-a[0])[0][1]);
  const topSell=DATES.map((_,d)=>V.map((r,i)=>[r[d],i]).sort((a,b)=>a[0]-b[0])[0][1]);
  let h='<div class="grid"><div></div>'+DATES.map(([d,w],c)=>{
    const tot=V.reduce((a,r)=>a+r[c],0);
    return `<div class="hd"><b>${d}(${w})</b><span class="tot" style="color:var(--${tot>=0?"up":"down"})">${pm(tot)}</span></div>`;
  }).join("");
  SECTORS.forEach((s,i)=>{
    h+=`<div class="rl">${s}<small>${N(amt[i]/10)}억(5일)</small></div>`;
    DATES.forEach((_,c)=>{
      const v=V[i][c],a=.10+.62*Math.abs(v)/maxAbs,rgb=v>=0?"var(--upRGB)":"var(--downRGB)";
      const mk=topBuy[c]===i?'<span class="mark b">매수1</span>':topSell[c]===i?'<span class="mark s">매도1</span>':"";
      h+=`<div class="cell" data-r="${i}" data-c="${c}" style="background:rgba(${rgb},${a.toFixed(2)})">${mk}${pm(v)}</div>`;
    });
  });
  h+='</div><svg class="paths" id="paths"></svg>';
  chart.innerHTML=h;chart._tops={topBuy,topSell};draw();
}
function center(r,c){
  const chart=document.getElementById("chart");
  const el=chart.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  const a=chart.getBoundingClientRect(),b=el.getBoundingClientRect();
  return [b.left-a.left+b.width/2,b.top-a.top+b.height/2];
}
function draw(){
  const chart=document.getElementById("chart"),svg=document.getElementById("paths");
  const {topBuy,topSell}=chart._tops;
  const poly=(rows,cls,dash)=>{
    const pts=rows.map((r,c)=>center(r,c));
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="var(--${cls})" stroke="var(--card)" stroke-width="1.5"/>`).join("");
    return `<path d="${d}" fill="none" stroke="var(--${cls})" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" ${dash?'stroke-dasharray="6 5"':""} opacity=".9"/>${dots}`;
  };
  svg.innerHTML=poly(topSell,"down",true)+poly(topBuy,"up",false);
}
build();addEventListener("resize",draw);
</script>
</body>
</html>
